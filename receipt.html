<!doctype html>
<html lang="th">
<head>

<title>ใบเบิก / ใบรับเงิน · Social Eyewear</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai+Looped:wght@400;500;600;700&family=Sarabun:wght@400;600;700&display=swap">
<style>
/* Layout: top bar + tabs; form beside a live A5 preview on wide screens, stacked on iPad portrait and phones. Tokens match the main app. */
:root{
  --bg:#f1f4f4;--panel:#fff;--panel2:#e8eeee;--fg:#16242a;--muted:#5a6b72;--line:#d3dcdd;
  --accent:#0b6f62;--accent-fg:#fff;--accent-soft:#d8efea;--loss:#b3322c;--loss-soft:#f9e3e1;--cost:#96600a;--cost-soft:#f8ecd3;
  --display:"Noto Sans Thai Looped","Sarabun",system-ui,sans-serif;--body:"Noto Sans Thai Looped","Sarabun",system-ui,sans-serif;
  --paper:"Sarabun","Anuphan",system-ui,sans-serif;
  padding-top:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1719;--panel:#172225;--panel2:#20302f;--fg:#e6eeee;--muted:#9bafb3;--line:#2d3f42;
  --accent:#4fcbb6;--accent-fg:#06211d;--accent-soft:#163a35;--loss:#f2918b;--loss-soft:#44201e;--cost:#e4b35b;--cost-soft:#3b2d12;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1719;--panel:#172225;--panel2:#20302f;--fg:#e6eeee;--muted:#9bafb3;--line:#2d3f42;
  --accent:#4fcbb6;--accent-fg:#06211d;--accent-soft:#163a35;--loss:#f2918b;--loss-soft:#44201e;--cost:#e4b35b;--cost-soft:#3b2d12;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--body);font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);line-height:1.25;margin:0;text-wrap:balance}
h1{font-size:1.4rem}h2{font-size:1.05rem}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{background:var(--panel);border-bottom:1px solid var(--line);padding-block:10px 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));position:sticky;top:env(safe-area-inset-top,0px);z-index:10}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--panel);z-index:11}
.top-in{max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.top-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.top-row h1{flex:1;min-width:0}
.back{color:var(--accent);text-decoration:none;font-weight:600;font-size:.9rem;white-space:nowrap}
.tabs{display:flex;gap:4px;overflow-x:auto}
.tabs a{padding:8px 12px;border-bottom:3px solid transparent;color:var(--muted);text-decoration:none;font-weight:500;white-space:nowrap}
.tabs a[aria-current="page"]{color:var(--accent);border-color:var(--accent);font-weight:600}
main{max-width:1320px;margin:0 auto;padding-block:16px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0;display:flex;flex-direction:column;gap:10px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:8px 13px;cursor:pointer;font-weight:500;min-height:40px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;color:var(--fg)}
.btn:hover{background:var(--panel2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
.btn.danger{color:var(--loss);border-color:var(--loss)}
.btn.sm{padding:4px 10px;min-height:32px;font-size:.86rem}
.btn:disabled{opacity:.55;cursor:default}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input,select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:7px 9px;min-height:40px;width:100%;min-width:0}
textarea{resize:vertical;min-height:64px}
input[type=date],input[type=month]{-webkit-appearance:none;appearance:none;display:block}
label{display:flex;flex-direction:column;gap:3px;font-size:.82rem;color:var(--muted);min-width:0}
label>*{font-size:.95rem;color:var(--fg)}
label.inline{flex-direction:row;align-items:center;gap:8px;font-size:.92rem;color:var(--fg)}
label.inline input{width:20px;min-height:20px}
.req::after{content:" *";color:var(--loss)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.seg button{border:1.5px solid var(--line);background:var(--panel);border-radius:9px;padding:10px 12px;text-align:left;cursor:pointer}
.seg button b{display:block;font-family:var(--display)}
.seg button span{font-size:.82rem;color:var(--muted)}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.radio{display:flex;gap:16px;flex-wrap:wrap}
.notice{background:var(--cost-soft);border-radius:8px;padding:9px 12px;font-size:.88rem}
.notice.err{background:var(--loss-soft)}
.error{color:var(--loss);font-weight:500;font-size:.9rem;min-height:1.2em}
.dim{color:var(--muted);font-size:.85rem}
.rx{width:100%;border-collapse:collapse}
.rx th{font-size:.78rem;color:var(--muted);font-weight:600;padding:4px;text-align:center}
.rx td{padding:3px}
.rx input{text-align:center;padding:6px 4px}
.tw{overflow-x:auto}
.total-box{background:var(--accent-soft);border-radius:9px;padding:10px 14px;display:flex;flex-direction:column;justify-content:center}
.total-box span{font-size:.8rem;color:var(--muted)}
.total-box b{font:700 1.5rem var(--display);color:var(--accent)}
.editor{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:14px;align-items:start}
.editor>div{display:flex;flex-direction:column;gap:14px;min-width:0}
.prev-wrap{position:sticky;top:120px}
.sheet-host{overflow:hidden;border-radius:6px;background:var(--panel2);padding:10px}
.sheet-scale{transform-origin:top left}
.foot{display:flex;flex-wrap:wrap;gap:8px;align-items:end;justify-content:space-between}
.foot label{width:min(220px,100%)}
table.list{width:100%;border-collapse:collapse}
table.list th{font-size:.78rem;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.list td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.list tr.click{cursor:pointer}table.list tr.click:hover td{background:var(--panel2)}
.r{text-align:right;white-space:nowrap}
.chip{display:inline-block;border-radius:5px;padding:0 7px;font-size:.75rem;font-weight:600;white-space:nowrap;background:var(--panel2);color:var(--muted)}
.chip.issued{background:var(--accent-soft);color:var(--accent)}
.chip.draft{background:var(--cost-soft);color:var(--cost)}
.chip.cancelled{background:var(--loss-soft);color:var(--loss)}
.empty{color:var(--muted);text-align:center;padding:28px 10px}
.logs{display:flex;flex-direction:column;gap:6px;font-size:.88rem}
.logs div{border-left:3px solid var(--line);padding-left:10px}
.pin{max-width:340px;width:100%;margin:12vh auto 0;text-align:center}
.pin input{text-align:center;font-size:1.6rem;letter-spacing:.5em;min-height:52px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:.9rem;max-width:calc(100vw - 32px)}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--fg);padding:0;width:min(640px,calc(100vw - 24px));max-height:calc(100dvh - 24px)}
dialog::backdrop{background:rgba(8,18,20,.55)}
dialog .in{padding:16px;display:flex;flex-direction:column;gap:12px}
#pv{width:100vw;max-width:100vw;height:100dvh;max-height:100dvh;margin:0;border-radius:0;border:0;background:#5d6668}
#pv .bar{position:sticky;top:0;background:var(--panel);display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);z-index:2}
#pv .stage{padding:20px 12px 40px;display:flex;justify-content:center}
#pv .sheet{box-shadow:0 4px 24px rgba(0,0,0,.35)}

/* ---------- A5 document: always black on white ---------- */
.sheet{width:148mm;height:210mm;background:#fff;color:#111;font:9.4pt/1.42 var(--paper);padding:8mm 9mm 8mm;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:3mm}
.sheet *{color:inherit}
.s-title{text-align:center;font-weight:700;font-size:13pt;letter-spacing:.01em}
.s-head{display:grid;grid-template-columns:30mm minmax(0,1fr) 39mm;gap:3mm;align-items:start;border-bottom:.3mm solid #111;padding-bottom:2.5mm}
.s-head img{width:30mm;height:auto;display:block}
.s-shop{font-size:8pt;line-height:1.38;overflow-wrap:anywhere}
.s-shop b{font-size:9pt;display:block}
.s-box{border:.25mm solid #111;border-radius:1.5mm;padding:1.5mm 2mm;font-size:8pt;display:grid;grid-template-columns:auto minmax(0,1fr);gap:.3mm 2mm}
.s-box span{white-space:nowrap}
.s-box b{overflow-wrap:anywhere;font-weight:600}
.s-cust{display:grid;grid-template-columns:auto minmax(0,1fr);gap:.6mm 4mm}
.s-cust dt{font-weight:600;white-space:nowrap}
.s-cust dd{margin:0;overflow-wrap:anywhere;white-space:pre-line}
.s-items{width:100%;border-collapse:collapse;border:.25mm solid #111}
.s-items th,.s-items td{border:.2mm solid #111;padding:1.2mm 2mm;vertical-align:top}
.s-items th{background:#eee;font-weight:600;text-align:center;white-space:nowrap}
.s-items td.n{text-align:right;white-space:nowrap;width:31mm}
.s-items tr.sum td{font-weight:700}
.s-items tr.sum td:first-child{text-align:right}
.s-items tr.words td{font-weight:600}
.s-sub{font-weight:700;margin-top:.5mm}
.s-rx{width:100%;border-collapse:collapse;text-align:center}
.s-rx th,.s-rx td{border:.2mm solid #111;padding:.9mm 1mm}
.s-rx th{background:#eee;font-weight:600}
.s-rx td:first-child{font-weight:600;white-space:nowrap}
.s-note{font-size:8.6pt;overflow-wrap:anywhere;white-space:pre-line}
.s-sign{margin-top:auto;display:flex;justify-content:flex-end}
.s-sign div{width:62mm;text-align:center;font-size:9pt}
.s-sign .line{border-bottom:.25mm dotted #111;height:9mm;margin-bottom:1mm}
.s-mark{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;font:700 40pt var(--paper);color:rgba(179,50,44,.18);transform:rotate(-24deg)}
.s-rev{position:absolute;left:9mm;bottom:3mm;font-size:6.5pt;color:#777}

#printRoot{display:none}
@page{size:148mm 210mm;margin:0}
@media print{
  html,body{background:#fff!important;margin:0;padding:0}
  body>*:not(#printRoot){display:none!important}
  #printRoot{display:block}
  #printRoot .sheet{box-shadow:none;page-break-after:avoid;break-after:avoid}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media(max-width:1000px){.editor{grid-template-columns:minmax(0,1fr)}.prev-wrap{position:static}}
@media(max-width:560px){.g3{grid-template-columns:minmax(0,1fr)}.seg{grid-template-columns:minmax(0,1fr)}.hide-s{display:none}h1{font-size:1.15rem}}
</style>

<header class="top" id="top" hidden>
  <div class="top-in">
    <div class="top-row"><a class="back" href="index.html">‹ โปรแกรมหลัก</a><h1>ใบเบิก / ใบรับเงิน</h1><button class="btn sm" id="lockBtn" type="button">ล็อกหน้าจอ</button></div>
    <nav class="tabs" id="tabs" aria-label="เมนูใบเบิก"></nav>
  </div>
</header>
<main id="main"></main>
<dialog id="dlg"></dialog>
<dialog id="pv" aria-label="ตัวอย่างก่อนพิมพ์"></dialog>
<div id="printRoot"></div>
<div id="toast" role="status" hidden></div>
<script src="config.js"></script>
<script>
'use strict';
const $=(s,r=document)=>r.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=parseFloat(String(v??'').replace(/,/g,''));return Number.isFinite(n)?n:0};
const r2=n=>Math.round((n+Number.EPSILON)*100)/100;
const money=n=>r2(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const pDate=k=>{const[y,m,d]=String(k).slice(0,10).split('-').map(Number);return new Date(y,m-1,d)};
const thDate=k=>k?pDate(k).toLocaleDateString('th-TH',{day:'numeric',month:'long',year:'numeric'}):'';
const thShort=k=>k?pDate(k).toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'2-digit'}):'';
const thDateTime=t=>t?new Date(t).toLocaleString('th-TH',{day:'numeric',month:'short',year:'2-digit',hour:'2-digit',minute:'2-digit'}):'';

/* ---------- จำนวนเงินเป็นตัวอักษรไทย ---------- */
const TH_DIGIT=['ศูนย์','หนึ่ง','สอง','สาม','สี่','ห้า','หก','เจ็ด','แปด','เก้า'];
const TH_POS=['','สิบ','ร้อย','พัน','หมื่น','แสน'];
function thaiNum(n){
  if(n===0)return '';
  if(n>=1e6){const hi=Math.floor(n/1e6),lo=n%1e6;return thaiNum(hi)+'ล้าน'+(lo?thaiGroup(lo,true):'')}
  return thaiGroup(n,false);
}
function thaiGroup(n,afterMillion){
  const s=String(n);let out='';
  for(let i=0;i<s.length;i++){
    const d=+s[i],pos=s.length-i-1;if(!d)continue;
    if(pos===1&&d===1)out+='สิบ';
    else if(pos===1&&d===2)out+='ยี่สิบ';
    else if(pos===0&&d===1&&(s.length>1||afterMillion))out+='เอ็ด';
    else out+=TH_DIGIT[d]+TH_POS[pos];
  }
  return out;
}
function bahtText(v){
  const n=r2(Math.abs(num(v)));const satang=Math.round(n*100)%100,baht=Math.round(n*100-satang)/100;
  if(!baht&&!satang)return 'ศูนย์บาทถ้วน';
  return (baht?thaiNum(baht)+'บาท':'')+(satang?thaiNum(satang)+'สตางค์':'ถ้วน');
}

/* ---------- ค่าสายตา ---------- */
function normPower(v){
  const t=String(v??'').trim().replace(/[−–]/g,'-');if(!t)return '';
  if(/^(pl|plano)$/i.test(t))return 'Plano';
  if(/^[+-]?(\d+(\.\d+)?|\.\d+)$/.test(t)){const n=parseFloat(t);return n===0?'0.00':(n>0?'+':'-')+Math.abs(n).toFixed(2)}
  return t;
}
const RX_KEYS=[['sph','SPH'],['cyl','CYL'],['axis','AXIS'],['add','ADD'],['pd','PD'],['h','H']];
function normRx(k,v){
  v=String(v??'').trim();if(!v)return '';
  if(k==='sph'||k==='cyl'||k==='add')return normPower(v);
  if(k==='axis'){const n=v.replace(/[^\d]/g,'');return n===''?v:String(parseInt(n,10))}
  return v;
}
function taxIdValid(id){const d=String(id).replace(/\D/g,'');if(d.length!==13)return false;let s=0;for(let i=0;i<12;i++)s+=(+d[i])*(13-i);return (11-s%11)%10===+d[12]}

/* ---------- ฐานข้อมูล (ใช้รหัส 4 หลักเดียวกับโปรแกรมหลัก) ---------- */
const CFG=window.SE_CONFIG||{};
const PIN_KEY='social-eyewear-pin';
let PIN='';
function readPin(){try{return sessionStorage.getItem(PIN_KEY)||''}catch(_){return ''}}
function savePin(v){try{v?sessionStorage.setItem(PIN_KEY,v):sessionStorage.removeItem(PIN_KEY)}catch(_){}}
async function rpc(fn,args){
  if(!CFG.supabaseUrl||!CFG.supabaseAnonKey)throw Object.assign(new Error('config'),{code:'config'});
  let res;
  try{res=await fetch(CFG.supabaseUrl.replace(/\/$/,'')+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:CFG.supabaseAnonKey,'Content-Type':'application/json'},body:JSON.stringify(args)})}
  catch(e){throw Object.assign(new Error('net'),{code:'net'})}
  if(!res.ok)throw Object.assign(new Error('http '+res.status),{code:res.status===404?'missing':'http',status:res.status});
  const j=await res.json();
  if(!j.ok)throw Object.assign(new Error(j.message||j.error),{code:j.error,msg:j.message,data:j});
  return j;
}
function errText(e){
  if(!e)return 'เกิดข้อผิดพลาด';
  if(e.msg)return e.msg;
  if(e.code==='bad_pin')return 'รหัสเปลี่ยนไปแล้ว กรุณาใส่รหัสใหม่';
  if(e.code==='locked')return 'ใส่รหัสผิดหลายครั้ง ระบบล็อกชั่วคราว 30 นาที';
  if(e.code==='missing')return 'ยังไม่ได้สร้างตารางใบเบิก ต้องรันไฟล์ 02_reimbursement.sql ใน Supabase ก่อน';
  if(e.code==='config')return 'ยังไม่ได้ตั้งค่า Supabase ใน config.js';
  return 'เชื่อมต่อไม่ได้ ตรวจอินเทอร์เน็ตแล้วลองอีกครั้ง';
}
function guard(e){if(e&&e.code==='bad_pin'){PIN='';savePin('');showPin('กรุณาใส่รหัสอีกครั้ง');return true}return false}

/* ---------- สถานะ ---------- */
const DEFAULT_SHOP={title:'ใบรับเงิน / ใบเบิกค่าตัดแว่น',name:'ร้านแว่นตาโซเชียล อายแวร์ SOCIAL EYEWEAR',address:'',phone:'',tax_id:'',receiver:'',book_no:'1',logo:''};
let SHOP={...DEFAULT_SHOP},NUMBERING={prefix:'RB',period:'month',digits:3,start:1},COUNTERS={};
let view='list',F=null,openDoc=null,openLogs=[],listState={q:'',month:'',date:'',type:'',rows:[],count:0,loading:false,loaded:false,err:''};
const TYPE_LABEL={frame_lens:'กรอบแว่นพร้อมเลนส์',lens_only:'เลนส์อย่างเดียว'};
const STATUS_LABEL={issued:'ออกแล้ว',draft:'ร่าง',cancelled:'ยกเลิก'};
const LENS_TYPES=['Single Vision','Progressive','Bifocal','Office / Workspace','Myopia Control'];
const TITLES=['คุณ','นาย','นาง','นางสาว','ด.ช.','ด.ญ.'];
function getEditor(){try{return localStorage.getItem('rb-editor')||''}catch(_){return ''}}
function setEditor(v){try{localStorage.setItem('rb-editor',v)}catch(_){}}

function blankDoc(){
  return {id:null,doc_no:'',book_no:SHOP.book_no||'',doc_date:today(),status:'issued',claim_type:'frame_lens',discount:'',receiver_name:SHOP.receiver||'',note:'',source_sale_id:'',revision:null,
    customer:{party_type:'person',title:'คุณ',first_name:'',last_name:'',company_name:'',branch:'',address:'',phone:'',show_tax_id:false,tax_id:''},
    frame:{brand:'',model:'',color:'',product_code:'',amount:''},
    lens:{brand:'',model:'',lens_index:'',coating:'',lens_type:'',amount:''},
    prescription:{},dirty:false};
}
function fromSaved(d){
  const f=blankDoc(),fr=(d.items||[]).find(i=>i.kind==='frame'),ln=(d.items||[]).find(i=>i.kind==='lens');
  Object.assign(f,{id:d.id,doc_no:d.doc_no,book_no:d.book_no||'',doc_date:String(d.doc_date).slice(0,10),status:d.status,claim_type:d.claim_type,discount:num(d.discount)?String(num(d.discount)):'',receiver_name:d.receiver_name||'',note:d.note||'',source_sale_id:d.source_sale_id||'',revision:d.revision});
  Object.assign(f.customer,Object.fromEntries(Object.entries(d.customer||{}).map(([k,v])=>[k,v??''])));f.customer.show_tax_id=!!(d.customer&&d.customer.show_tax_id);
  if(fr)Object.assign(f.frame,Object.fromEntries(Object.entries(fr).map(([k,v])=>[k,v??''])),{amount:String(num(fr.amount))});
  if(ln)Object.assign(f.lens,Object.fromEntries(Object.entries(ln).map(([k,v])=>[k,v??''])),{amount:String(num(ln.amount))});
  f.prescription=Object.fromEntries(Object.entries(d.prescription||{}).map(([k,v])=>[k,v??'']));
  return f;
}
function calc(f){
  const frame=f.claim_type==='frame_lens'?r2(num(f.frame.amount)):0,lens=r2(num(f.lens.amount)),sub=r2(frame+lens),disc=r2(num(f.discount));
  return {frame,lens,sub,disc,total:r2(sub-disc)};
}
function toPayload(f){
  const c=calc(f),items=[];
  if(f.claim_type==='frame_lens')items.push({kind:'frame',...f.frame,amount:c.frame});
  items.push({kind:'lens',...f.lens,amount:c.lens});
  const rx={};Object.entries(f.prescription).forEach(([k,v])=>{const t=String(v??'').trim();if(t)rx[k]=t});
  const cu={...f.customer};if(!cu.show_tax_id)cu.tax_id='';
  return {id:f.id,book_no:f.book_no.trim(),doc_date:f.doc_date,status:f.status,claim_type:f.claim_type,discount:c.disc,total:c.total,amount_text:bahtText(c.total),
    receiver_name:f.receiver_name.trim(),note:f.note.trim(),source_sale_id:f.source_sale_id||'',revision:f.revision,customer:cu,items,prescription:rx};
}
/* แปลงฟอร์มเป็นรูปแบบเดียวกับเอกสารที่บันทึกแล้ว เพื่อใช้แสดงตัวอย่าง */
function asDoc(f){const p=toPayload(f),c=calc(f);return {...p,doc_no:f.doc_no||'',subtotal:c.sub}}

function custName(c){
  if(!c)return '';
  if(c.party_type==='company')return [c.company_name,c.branch?('สาขา '+c.branch):''].filter(Boolean).join(' ');
  const t=c.title||'';return (t==='คุณ'?t:(t?t+' ':''))+[c.first_name,c.last_name].filter(Boolean).join(' ');
}
function itemText(i){
  if(i.kind==='frame')return ['กรอบแว่นตา',i.brand,i.model,i.color?'สี'+i.color:'',i.product_code?'รหัส '+i.product_code:''].filter(Boolean).join(' ');
  return ['เลนส์',i.brand,i.model,i.lens_type,i.lens_index?'Index '+i.lens_index:'',i.coating].filter(Boolean).join(' ');
}
function rxTable(rx){
  rx=rx||{};const v=(e,k)=>String(rx[e+'_'+k]??'').trim();
  const pdT=String(rx.pd_total??'').trim(),eyePd=v('r','pd')||v('l','pd');
  const cols=RX_KEYS.filter(([k])=>k==='pd'?(eyePd||pdT):(v('r',k)||v('l',k)));

    if(k==='pd'&&!eyePd)return ri===0?`<td rowspan="${eyes.length}">${esc(pdT)}</td>`:'';
    return `<td>${esc(v(e,k)||'–')}</td>`}).join('')}</tr>`).join('');
  const extra=eyePd&&pdT?`<div class="s-note">PD รวม ${esc(pdT)}</div>`:'';
  return `<div class="s-sub">ผลการตรวจวัดสายตา</div><table class="s-rx"><thead><tr><th></th>${cols.map(([,l])=>`<th>${l}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table>${extra}`;

function updatePreview(){

function validate(f,mode){
  const c=f.customer,cc=calc(f);
  if(!f.doc_date)return 'กรุณาเลือกวันที่ออกเอกสาร';
  if(cc.disc<0||cc.frame<0||cc.lens<0)return 'จำนวนเงินต้องไม่ติดลบ';
  if(cc.total<0)return 'ส่วนลดมากกว่ายอดรวม';
  if(c.show_tax_id&&String(c.tax_id).replace(/\D/g,'').length!==13)return 'เลขประจำตัวผู้เสียภาษีต้องมี 13 หลัก หรือเอาเครื่องหมายถูกออก';
  for(const e of['r','l']){const a=String(f.prescription[e+'_axis']||'').trim();if(a&&!(/^\d{1,3}$/.test(a)&&+a<=180))return 'AXIS ต้องเป็นตัวเลข 0 ถึง 180'}
  if(mode!=='draft'&&f.status!=='draft'){
    if(c.party_type==='company'?!c.company_name.trim():!c.first_name.trim())return c.party_type==='company'?'กรุณากรอกชื่อนิติบุคคล':'กรุณากรอกชื่อลูกค้า';
    if(!(cc.total>0))return 'ยอดรวมต้องมากกว่า 0 กรุณากรอกราคา';
  }
  if(!$('#f_editor').value.trim())return 'กรุณาใส่ชื่อผู้บันทึก';
  return '';
}
async function save(mode,btn){
  const err=$('#fErr');err.textContent='';
  if(mode==='draft')F.status='draft';
  else if(F.status==='draft'&&!F.id)F.status='issued';
  const m=validate(F,mode);if(m){err.textContent=m;return}
  const editor=$('#f_editor').value.trim();setEditor(editor);
  document.querySelectorAll('[data-act=save]').forEach(b=>b.disabled=true);
  try{
    const j=await rpc('rb_save',{p_pin:PIN,p_doc:toPayload(F),p_editor:editor});
    const wasNew=!F.id;F=null;openDoc=j.doc;openLogs=[];listState.loaded=false;
    toast(wasNew?`บันทึกแล้ว เลขที่ ${j.doc.doc_no}`:'บันทึกการแก้ไขแล้ว');
    setView('doc');loadLogs(j.doc.id);
    if(mode==='print')openPreview(j.doc);
  }catch(e){if(guard(e))return;err.textContent=errText(e);document.querySelectorAll('[data-act=save]').forEach(b=>b.disabled=false)}
}

/* ----- ดึงจากบิลขาย (อ่านอย่างเดียว ไม่แก้บิลเดิม) ----- */
let SALES=null;
async function openSalePicker(){
  const d=$('#dlg');d.innerHTML=`<div class="in"><div class="tools" style="justify-content:space-between"><h2>ดึงข้อมูลจากบิลขาย</h2><button type="button" class="btn sm" data-act="dlg-close">ปิด</button></div><input id="saleQ" type="search" placeholder="ค้นหาเลขใบเสร็จ ชื่อ หรือเบอร์โทร" aria-label="ค้นหาบิลขาย"><div id="saleList" class="empty">กำลังโหลดบิลขาย</div></div>`;
  if(!d.open)d.showModal();
  if(!SALES){try{const rows=[];for(let from=0;;from+=1000){const j=await rpc('app_list',{p_pin:PIN,p_from:from,p_limit:1000});j.rows.forEach(r=>{if(r.col==='sales')rows.push({id:r.id,...r.data})});if(j.rows.length<1000)break}
    SALES=rows.filter(s=>s.frame||s.lens).sort((a,b)=>(b.date||'').localeCompare(a.date||''))}catch(e){if(guard(e)){d.close();return}$('#saleList').textContent=errText(e);return}}
  drawSales();
}
function drawSales(){
  const q=($('#saleQ')?.value||'').trim().toLowerCase(),qd=q.replace(/\D/g,'');
  const l=SALES.filter(s=>!q||[s.receipt,s.customer].join(' ').toLowerCase().includes(q)||(qd.length>=3&&String(s.phone||'').replace(/\D/g,'').includes(qd))).slice(0,60);
  $('#saleList').className='';
  $('#saleList').innerHTML=l.length?`<table class="list"><tbody>${l.map(s=>`<tr class="click" data-act="pick-sale" data-id="${esc(s.id)}" tabindex="0"><td style="white-space:nowrap">${esc(thShort(s.date))}</td><td><b>${esc(s.receipt||'–')}</b><div class="dim">${esc(s.customer||'ไม่ระบุชื่อ')}</div></td><td class="dim">${esc([s.frame&&[s.frame.brand,s.frame.model].filter(Boolean).join(' '),s.lens&&[s.lens.brand,s.lens.model].filter(Boolean).join(' ')].filter(Boolean).join(' + '))}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">ไม่พบบิลขายที่มีกรอบหรือเลนส์</div>';
}
function pickSale(id){
  const s=SALES.find(x=>x.id===id);if(!s)return;
  const parts=String(s.customer||'').trim().split(/\s+/);let title='คุณ';
  if(parts[0]&&TITLES.includes(parts[0]))title=parts.shift();
  Object.assign(F.customer,{party_type:'person',title,first_name:parts.shift()||'',last_name:parts.join(' '),phone:s.phone||F.customer.phone});
  if(s.frame)Object.assign(F.frame,{brand:s.frame.brand||'',model:s.frame.model||'',color:s.frame.color||'',product_code:(s.frame.meta&&s.frame.meta.code)||'',amount:String(num(s.frame.price))});
  if(s.lens)Object.assign(F.lens,{brand:s.lens.brand||'',model:s.lens.model||'',coating:s.lens.coating||'',lens_index:s.lens.index||'',amount:String(num(s.lens.price))});
  F.claim_type=s.frame?'frame_lens':'lens_only';F.discount=num(s.discount)?String(num(s.discount)):'';F.source_sale_id=s.id;F.source_sale_receipt=s.receipt||'';
  if(s.date)F.doc_date=s.date;F.dirty=true;
  $('#dlg').close();render();toast('ดึงข้อมูลแล้ว ตรวจชื่อ ที่อยู่ และราคาก่อนบันทึก');
}

    if(m[1]==='tax_id'){const h=$('#taxHint');if(h)h.innerHTML=t.value&&!taxIdValid(t.value)?'<span style="color:var(--loss)">เลขนี้อาจพิมพ์ผิด ตรวจอีกครั้ง (บันทึกได้)</span>':''}}
  else if((m=id.match(/^fr_(.+)$/)))F.frame[m[1]]=t.value;
  else if((m=id.match(/^ln_(.+)$/)))F.lens[m[1]]=t.value;
  else if((m=id.match(/^rx_(.+)$/)))F.prescription[m[1]]=t.value;
  else if(t.name==='party'){F.customer.party_type=t.value;F.dirty=true;render();return}
  else return;
  F.dirty=true;clearTimeout(prevT);prevT=setTimeout(updatePreview,120);
});
document.addEventListener('change',ev=>{
  const t=ev.target,m=(t.id||'').match(/^rx_([rl])_(\w+)$/);
  if(m&&F){const v=normRx(m[2],t.value);t.value=v;F.prescription[m[1]+'_'+m[2]]=v;updatePreview()}
  if(t.id==='st_logo')readLogo(t.files[0]);
  if(t.name==='party'&&F){F.customer.party_type=t.value;render()}
});
window.addEventListener('beforeunload',ev=>{if(F&&F.dirty){ev.preventDefault();ev.returnValue=''}});
let rz;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{fitPreview($('#formPrev'));fitPreview($('#docPrev'))},120)});
function route(){
  const h=location.hash.slice(1);
  if(h.startsWith('doc=')){const id=h.slice(4);if(!openDoc||openDoc.id!==id)return loadDoc(id);view='doc';return render()}
  if(h.startsWith('edit=')){const id=h.slice(5);if(F&&F.id===id){view='edit';return render()}location.replace('#doc='+id);return}
  if(h==='new'){if(!F||F.id)F=blankDoc();view='new';return render()}
  if(h==='settings'){view='settings';return render()}
  view='list';listState.loaded=false;render();
}
window.addEventListener('hashchange',()=>{if(PIN)route()});
$('#lockBtn').onclick=()=>{PIN='';savePin('');F=null;showPin('')};

/* ---------- รหัสเข้าโปรแกรม ---------- */
function showPin(msg){
  $('#top').hidden=true;
  $('#main').innerHTML=`<form id="pinForm" class="panel pin" novalidate><h1>Social Eyewear</h1><p class="dim" style="margin:0">ใส่รหัส 4 หลักเพื่อเข้าระบบใบเบิก</p><input id="pinInput" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" aria-label="รหัส 4 หลัก"><div class="error" id="pinErr" role="alert">${esc(msg||'')}</div><button class="btn primary">เข้าใช้งาน</button><a class="back" href="index.html">‹ กลับโปรแกรมหลัก</a></form>`;
  $('#pinInput').focus();
}
let pinBusy=false;
async function checkPin(){
  const i=$('#pinInput'),e=$('#pinErr');if(pinBusy||!i||!i.value)return;pinBusy=true;e.textContent='กำลังตรวจรหัส';
  try{await rpc('app_login',{p_pin:i.value});PIN=i.value;savePin(PIN);pinBusy=false;start();return}
  catch(x){i.value='';i.focus();e.textContent=x.code==='bad_pin'?'รหัสไม่ถูกต้อง':errText(x)}
  pinBusy=false;
}
async function start(){
  $('#main').innerHTML='<div class="empty">กำลังโหลด</div>';
  try{const j=await rpc('rb_settings',{p_pin:PIN});SHOP={...DEFAULT_SHOP,...(j.shop||{})};NUMBERING={...NUMBERING,...(j.numbering||{})};COUNTERS=j.counters||{}}
  catch(e){if(guard(e))return;$('#top').hidden=false;$('#main').innerHTML=`<div class="panel"><div class="error">${esc(errText(e))}</div><div class="tools"><button type="button" class="btn" onclick="location.reload()">ลองอีกครั้ง</button><a class="btn" href="index.html">กลับโปรแกรมหลัก</a></div></div>`;return}
  route();
}
PIN=readPin();
if(PIN)start();else showPin('');
</script>
