<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<style>:root{padding-top:env(safe-area-inset-top,0px)}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Social Eyewear บัญชีร้าน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600&family=Bai+Jamjuree:wght@500;600;700&display=swap">
<style>
/* Layout: side rail + working column; phone swaps the rail for a bottom bar. Colour comes from lens coatings: anti-reflective green and violet on cool optical-glass neutrals. */
:root{
  --bg:#f1f4f4;--panel:#fff;--panel2:#e8eeee;--fg:#16242a;--muted:#5a6b72;--line:#d3dcdd;
  --accent:#0b6f62;--accent-fg:#fff;--accent-soft:#d8efea;
  --sales:#6341b0;--sales-soft:#ebe5f8;--orders:#1b63b5;--orders-soft:#dfebf9;--profit:#12784a;--profit-soft:#dcf2e6;
  --cost:#96600a;--cost-soft:#f8ecd3;--loss:#b3322c;--loss-soft:#f9e3e1;
  --display:"Bai Jamjuree","Anuphan",system-ui,sans-serif;--body:"Anuphan","Noto Sans Thai",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1719;--panel:#172225;--panel2:#20302f;--fg:#e6eeee;--muted:#9bafb3;--line:#2d3f42;
  --accent:#4fcbb6;--accent-fg:#06211d;--accent-soft:#163a35;
  --sales:#b7a0f0;--sales-soft:#2c2548;--orders:#7db6f2;--orders-soft:#1a2f49;--profit:#62d39a;--profit-soft:#153a29;
  --cost:#e4b35b;--cost-soft:#3b2d12;--loss:#f2918b;--loss-soft:#44201e;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1719;--panel:#172225;--panel2:#20302f;--fg:#e6eeee;--muted:#9bafb3;--line:#2d3f42;
  --accent:#4fcbb6;--accent-fg:#06211d;--accent-soft:#163a35;
  --sales:#b7a0f0;--sales-soft:#2c2548;--orders:#7db6f2;--orders-soft:#1a2f49;--profit:#62d39a;--profit-soft:#153a29;
  --cost:#e4b35b;--cost-soft:#3b2d12;--loss:#f2918b;--loss-soft:#44201e;color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 var(--body);font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);line-height:1.25;margin:0;text-wrap:balance}
h1{font-size:1.55rem}h2{font-size:1.1rem}h3{font-size:.95rem}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:216px minmax(0,1fr);min-height:100vh}
.rail{background:var(--panel);border-right:1px solid var(--line);padding:20px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:18px}
.brand{font-family:var(--display);font-weight:700;font-size:1.08rem;padding-inline:10px;line-height:1.2}
.brand small{display:block;font:500 .76rem var(--body);color:var(--muted);margin-top:3px}
.nav{display:flex;flex-direction:column;gap:3px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:7px;color:var(--muted);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--panel2);color:var(--fg)}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav svg{width:19px;height:19px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav .short{display:none}
.show-s{display:none}
#acct{margin-top:auto}.acct{display:flex;flex-direction:column;gap:6px;padding-inline:10px;overflow-wrap:anywhere}
main{min-width:0;padding-block:22px 48px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px;max-width:1180px;width:100%}
.head{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;justify-content:space-between}
.head>div{min-width:0}
.sub{color:var(--muted);font-size:.88rem;margin:2px 0 0}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:8px 13px;cursor:pointer;font-weight:500;min-height:38px}
.btn:hover{background:var(--panel2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
.btn.primary:hover{filter:brightness(1.08);background:var(--accent)}
.btn.danger{color:var(--loss);border-color:var(--loss)}
.btn.sm{padding:4px 9px;min-height:30px;font-size:.84rem}
.btn:disabled{opacity:.55;cursor:default}
.month{display:inline-flex;align-items:center;border:1px solid var(--line);background:var(--panel);border-radius:7px}
.month button{border:0;background:none;cursor:pointer;width:38px;height:38px;font-size:1.05rem}
.month button:hover{background:var(--panel2)}
.month b{font-weight:600;padding-inline:6px;min-width:128px;text-align:center}
.notice{background:var(--cost-soft);border-radius:8px;padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;font-size:.9rem}
.notice.err{background:var(--loss-soft)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.panel>h2{margin-bottom:10px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.tile{background:var(--panel);padding:12px 14px;min-width:0}
.tile span{display:block;color:var(--muted);font-size:.8rem}
.tile b{display:block;font:600 1.32rem var(--display);margin-top:2px;overflow-wrap:anywhere}
.tile small{color:var(--muted);font-size:.74rem}
.c-sales{color:var(--sales)}.c-orders{color:var(--orders)}.c-profit{color:var(--profit)}.c-cost{color:var(--cost)}.c-loss{color:var(--loss)}
.chip{display:inline-block;border-radius:5px;padding:0 6px;font-size:.74rem;font-weight:600;white-space:nowrap}
.chip.ex{background:var(--cost-soft);color:var(--cost)}
.chip.loss{background:var(--loss-soft);color:var(--loss)}
.chip.ev{background:var(--orders-soft);color:var(--orders)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:.77rem;color:var(--muted);font-weight:600;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
.r{text-align:right;white-space:nowrap}
tr.click{cursor:pointer}tr.click:hover td{background:var(--panel2)}
.dim{color:var(--muted);font-size:.84rem}
.empty{color:var(--muted);text-align:center;padding:26px 12px}
.search{width:min(280px,100%)}
input,select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:7px 9px;min-height:38px;width:100%;min-width:0}
input:disabled{background:var(--panel2)}
label{display:flex;flex-direction:column;gap:3px;font-size:.82rem;color:var(--muted);min-width:0}
label>*{font-size:.95rem;color:var(--fg)}
label.check{flex-direction:row;align-items:center;gap:6px}
label.check input{width:18px;min-height:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}
/* statement */
.stmt td{padding:7px 4px}
.stmt .tot td{font-weight:600;background:var(--panel2);font-family:var(--display)}
.stmt .tot td:first-child{border-radius:6px 0 0 6px;padding-left:8px}.stmt .tot td:last-child{border-radius:0 6px 6px 0;padding-right:8px}
.stmt .net td{font-size:1.12rem}
/* question list */
.qa{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.qa>div{background:var(--panel);padding:12px 14px;min-width:0}
.qa .q{color:var(--muted);font-size:.82rem;display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center}
.qa .q select{width:auto;min-height:26px;padding:0 4px;font-size:.82rem}
.qa .a{font:600 1.08rem var(--display);margin-top:4px;overflow-wrap:anywhere}
.qa .n{font-size:.8rem;color:var(--muted)}
/* calendar */
.dow,.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.dow div{font-size:.76rem;color:var(--muted);text-align:center;padding-bottom:5px;font-weight:600}
.cal{gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.day{background:var(--panel);border:0;text-align:left;padding:6px 7px;min-height:104px;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0;align-items:stretch}
.day:hover{background:var(--panel2)}
.day.out{background:var(--bg);color:var(--muted)}
.day .d{font-weight:600;font-size:.84rem}
.day.today .d{background:var(--accent);color:var(--accent-fg);border-radius:50%;width:24px;height:24px;display:grid;place-items:center}
.day.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.m{display:flex;gap:4px;align-items:center;font-size:.75rem;overflow:hidden;white-space:nowrap}
.m i{width:7px;height:7px;border-radius:50%;flex:none;background:currentColor}
.m span{color:var(--fg);overflow:hidden;text-overflow:ellipsis}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.8rem;color:var(--muted)}
.legend .m{font-size:.8rem}.legend .m span{color:var(--muted)}
/* chart */
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%}
.chart text{fill:var(--muted);font:11px var(--body)}
.chart .grid-l{stroke:var(--line);stroke-width:1}
.chart .bar{fill:var(--sales)}
.chart .hit{fill:transparent;cursor:default}
.chart .hit:hover,.chart .hit:focus{fill:var(--panel2);fill-opacity:.7;outline:0}
#tip{position:fixed;z-index:30;background:var(--fg);color:var(--bg);padding:7px 10px;border-radius:7px;font-size:.8rem;pointer-events:none;white-space:pre-line;max-width:240px}
/* dialog */
dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--fg);padding:0;width:min(760px,calc(100vw - 24px));max-height:calc(100dvh - 24px)}
dialog::backdrop{background:rgba(8,18,20,.55)}
dialog form{display:flex;flex-direction:column;gap:14px;padding:18px}
.dhead{display:flex;justify-content:space-between;gap:10px;align-items:center}
fieldset{border:1px solid var(--line);border-radius:9px;padding:10px 12px 12px;margin:0;min-width:0;display:flex;flex-direction:column;gap:10px}
legend{font:600 .9rem var(--display);padding-inline:5px;display:flex;align-items:center;gap:8px}
.calc{background:var(--panel2);border-radius:9px;padding:10px 14px}
.calc table td{border:0;padding:2px 0}
.calc .tot td{font-weight:600;border-top:1px solid var(--line);padding-top:4px}
.dfoot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;position:sticky;bottom:0;background:var(--panel);padding-block:10px 0;border-top:1px solid var(--line)}
.dfoot div{display:flex;gap:8px;margin-left:auto}
.error{color:var(--loss);font-size:.88rem;font-weight:500}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:.9rem;max-width:calc(100vw - 32px)}
@media(min-width:821px){#toast{bottom:24px}}
.bars{display:flex;flex-direction:column;gap:7px}
@media(max-width:820px){
  .app{display:block}
  .rail{position:fixed;inset:auto 0 0 0;height:auto;z-index:20;border-right:0;border-top:1px solid var(--line);padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px));padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px));display:block}
  .brand{display:none}
  #acct{display:none}
  .show-s{display:block}
  .nav{flex-direction:row}
  .nav a{flex:1 1 0;flex-direction:column;gap:1px;font-size:.7rem;padding:5px 1px;min-width:0;text-align:center}
  .nav .long{display:none}.nav .short{display:inline}
  main{padding-block:14px 92px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .two{grid-template-columns:minmax(0,1fr)}
  .day{min-height:66px;padding:4px 3px}
  .day .m{font-size:.64rem;gap:2px}.day .m i{width:5px;height:5px}
  .day .hide-s{display:none}
  .month b{min-width:112px}
  .hide-s{display:none}
}
@media(prefers-reduced-motion:no-preference){.btn,.nav a{transition:background .12s}}
</style>

</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brand">Social Eyewear<small>บัญชีบริหารร้าน</small></div>
    <nav class="nav" id="nav" aria-label="เมนูหลัก"></nav>
    <div id="acct"></div>
  </aside>
  <main id="main"></main>
</div>
<dialog id="dlg"></dialog>
<div id="tip" hidden></div>
<div id="toast" role="status" hidden></div>

<script src="config.js"></script>
<script>
'use strict';
const $=(s,r=document)=>r.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=parseFloat(String(v??'').replace(/,/g,''));return Number.isFinite(n)?n:0};
const money=n=>{const r=Math.round((n||0)*100)/100;return (r<0?'−':'')+Math.abs(r).toLocaleString('th-TH',{maximumFractionDigits:2})};
const baht=n=>money(n)+' บาท';
const pad=n=>String(n).padStart(2,'0');
const dKey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pDate=k=>{const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const today=()=>dKey(new Date());
const shiftYm=(ym,n)=>{const[y,m]=ym.split('-').map(Number);const d=new Date(y,m-1+n,1);return `${d.getFullYear()}-${pad(d.getMonth()+1)}`};
const ymLabel=ym=>pDate(ym+'-01').toLocaleDateString('th-TH',{month:'long',year:'numeric'});
const ymShort=ym=>pDate(ym+'-01').toLocaleDateString('th-TH',{month:'short'});
const dLabel=k=>pDate(k).toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'2-digit'});
const dLong=k=>pDate(k).toLocaleDateString('th-TH',{weekday:'long',day:'numeric',month:'long',year:'numeric'});

/* ---------- บัญชี: แยกยอดขาย ต้นทุนสินค้า และค่าใช้จ่ายออกจากกัน ---------- */
function calcSale(s){
  const fs=s.frame?num(s.frame.price):0, ls=s.lens?num(s.lens.price):0;
  const fc=s.frame?num(s.frame.cost):0, lc=s.lens?num(s.lens.cost):0;
  const discount=num(s.discount), gross=fs+ls, revenue=gross-discount, cogs=fc+lc;
  const direct=num(s.accessory)+num(s.labor)+num(s.other);
  const ratio=gross>0?revenue/gross:0;
  return {fs,ls,fc,lc,discount,gross,revenue,cogs,direct,grossProfit:revenue-cogs,profit:revenue-cogs-direct,frameNet:fs*ratio,lensNet:ls*ratio};
}
function summarize(sales,ledger){
  const o={bills:sales.length,revenue:0,cogs:0,direct:0,shopExpense:0,otherIncome:0,discount:0};
  const people=new Set();let anon=0;
  sales.forEach(s=>{const c=calcSale(s);o.revenue+=c.revenue;o.cogs+=c.cogs;o.direct+=c.direct;o.discount+=c.discount;
    const n=(s.customer||'').trim().toLowerCase();if(n)people.add(n);else anon++});
  (ledger||[]).forEach(e=>{if(e.type==='income')o.otherIncome+=num(e.amount);else o.shopExpense+=num(e.amount)});
  o.customers=people.size+anon;o.avg=o.bills?o.revenue/o.bills:0;
  o.grossProfit=o.revenue-o.cogs;o.opex=o.direct+o.shopExpense;o.net=o.grossProfit-o.opex+o.otherIncome;
  return o;
}
function rank(sales,part,keyFn){
  const m=new Map();
  sales.forEach(s=>{const it=s[part];if(!it)return;const c=calcSale(s);const k=keyFn(it);
    const r=m.get(k)||{key:k,units:0,revenue:0,cost:0,profit:0};
    const rev=part==='frame'?c.frameNet:c.lensNet,cost=num(it.cost);
    r.units++;r.revenue+=rev;r.cost+=cost;r.profit+=rev-cost;m.set(k,r)});
  return [...m.values()];
}
function parsePasted(text){
  const items=[],errors=[];
  text.split(/\r?\n/).forEach((line,i)=>{
    if(!line.trim())return;
    const c=line.split('\t').map(x=>x.trim());
    if(i===0&&/ประเภท|type/i.test(c[0]))return;
    const kind=/เลนส์|lens/i.test(c[0])?'lens':/กรอบ|frame/i.test(c[0])?'frame':null;
    if(!kind||!c[1]||!c[2]||c.length<7){errors.push(`แถว ${i+1}: ต้องมี 7 ช่อง คือ ประเภท ยี่ห้อ รุ่น Coating/สี Index ทุน ขาย`);return}
    const p={kind,brand:c[1],model:c[2],cost:num(c[5]),price:num(c[6])};
    if(kind==='lens'){p.coating=c[3];p.index=c[4]}else p.color=c[3];
    items.push(p)});
  return {items,errors};
}
const pKey=p=>[p.kind,p.brand,p.model,p.kind==='lens'?p.coating:p.color,p.kind==='lens'?p.index:''].map(x=>String(x||'').trim().toLowerCase()).join('|');

/* ---------- ที่เก็บข้อมูล: Supabase (ตรวจรหัสที่ฐานข้อมูล) หรือเบราว์เซอร์เครื่องนี้ ---------- */
const S={products:[],sales:[],ledger:[],events:[]};
const COLS=Object.keys(S);
const LS_KEY='social-eyewear-data-v1',PIN_KEY='social-eyewear-pin';
const CFG=window.SE_CONFIG||{};
const remote=!!(CFG.supabaseUrl&&CFG.supabaseAnonKey);
let mode='loading',PIN='',writeSeq=0,pollT=null,pinBusy=false;
const newId=()=>(crypto.randomUUID?crypto.randomUUID():'id-'+Date.now()+'-'+Math.random().toString(36).slice(2));
function errText(e){
  if(e&&e.code==='locked')return 'ใส่รหัสผิดหลายครั้ง ระบบล็อกชั่วคราว 30 นาที ลองใหม่ภายหลัง';
  if(e&&e.code==='bad_pin')return 'รหัสเปลี่ยนไปแล้ว กรุณาเข้าโปรแกรมใหม่';
  if(e&&e.name==='QuotaExceededError')return 'พื้นที่ในเบราว์เซอร์เต็ม ควรเชื่อม Supabase แล้วลองอีกครั้ง';
  return 'บันทึกไม่สำเร็จ ตรวจอินเทอร์เน็ตแล้วลองอีกครั้ง';
}
async function rpc(fn,args){
  const res=await fetch(CFG.supabaseUrl.replace(/\/$/,'')+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:CFG.supabaseAnonKey,'Content-Type':'application/json'},body:JSON.stringify(args)});
  if(!res.ok)throw Object.assign(new Error('http '+res.status),{code:'http',status:res.status});
  const j=await res.json();
  if(!j.ok)throw Object.assign(new Error(j.error),{code:j.error});
  return j;
}
function savePin(v){try{v?sessionStorage.setItem(PIN_KEY,v):sessionStorage.removeItem(PIN_KEY)}catch(_){}}
function readPin(){try{return sessionStorage.getItem(PIN_KEY)||''}catch(_){return ''}}
function saveLocal(){localStorage.setItem(LS_KEY,JSON.stringify(S))}
function loadLocal(){
  try{const d=JSON.parse(localStorage.getItem(LS_KEY)||'{}');COLS.forEach(c=>{if(Array.isArray(d[c]))S[c]=d[c]})}
  catch(_){mode='nostore'}
}
function backToPin(msg){
  clearInterval(pollT);PIN='';savePin('');COLS.forEach(c=>S[c]=[]);
  if(dlg.open)dlg.close();
  mode='pin';$('#main').innerHTML='';render();
  const e=$('#pinErr');if(e&&msg)e.textContent=msg;
  const i=$('#pinInput');if(i)i.focus();
}
function authGone(e){if(e&&e.code==='bad_pin'){backToPin('กรุณาใส่รหัสอีกครั้ง');return true}return false}
async function put(col,id,data){
  const body={...data};delete body.id;
  if(remote){writeSeq++;try{await rpc('app_put',{p_pin:PIN,p_col:col,p_id:id,p_data:body})}catch(e){authGone(e);throw e}}
  const prev=S[col];S[col]=prev.filter(x=>x.id!==id).concat({id,...body});
  if(!remote&&mode!=='nostore'){try{saveLocal()}catch(e){S[col]=prev;throw e}}
  render();
}
async function del(col,id){
  if(remote){writeSeq++;try{await rpc('app_del',{p_pin:PIN,p_col:col,p_id:id})}catch(e){authGone(e);throw e}}
  const prev=S[col];S[col]=prev.filter(x=>x.id!==id);
  if(!remote&&mode!=='nostore'){try{saveLocal()}catch(e){S[col]=prev;throw e}}
  render();
}
async function fetchAll(){
  const seq=writeSeq,next={products:[],sales:[],ledger:[],events:[]},size=1000;
  for(let from=0;;from+=size){
    const{rows}=await rpc('app_list',{p_pin:PIN,p_from:from,p_limit:size});
    rows.forEach(r=>{if(next[r.col])next[r.col].push({id:r.id,...r.data})});
    if(rows.length<size)break;
  }
  if(seq!==writeSeq)return;
  const changed=COLS.some(c=>JSON.stringify(next[c])!==JSON.stringify([...S[c]].sort((a,b)=>a.id<b.id?-1:a.id>b.id?1:0)));
  if(changed||mode!=='live'){COLS.forEach(c=>S[c]=next[c]);mode='live';render()}
}
async function refresh(){
  if(mode==='pin')return;
  try{await fetchAll()}
  catch(e){if(authGone(e))return;mode=mode==='live'||mode==='stale'?'stale':'error';render()}
}
async function enterApp(){
  mode='loading';$('#main').innerHTML='';render();
  await refresh();
  clearInterval(pollT);pollT=setInterval(()=>{if(!document.hidden)refresh()},60000);
}

/* ---------- สรุปผล ---------- */
function niceMax(v){if(v<=0)return 1000;const p=10**Math.floor(Math.log10(v));const n=v/p;return (n<=1?1:n<=2?2:n<=5?5:10)*p}
function chartData(){
  if(chartMode==='day'){const[y,m]=ym.split('-').map(Number),n=new Date(y,m,0).getDate();
    return Array.from({length:n},(_,i)=>{const k=`${ym}-${pad(i+1)}`,s=summarize(S.sales.filter(x=>x.date===k));return{label:String(i+1),show:i===0||(i+1)%5===0,title:dLabel(k),...s}})}
  return Array.from({length:12},(_,i)=>{const k=shiftYm(ym,i-11),s=summarize(inMonth(S.sales,k));return{label:ymShort(k),show:true,title:ymLabel(k),...s}});
}
function chartSvg(data,w){
  const h=220,L=52,R=6,T=10,B=24,iw=w-L-R,ih=h-T-B,max=niceMax(Math.max(...data.map(d=>d.revenue))),step=iw/data.length,bw=Math.max(3,Math.min(step-2,34));
  let g='';for(let i=0;i<=4;i++){const v=max*i/4,y=T+ih-ih*i/4;g+=`<line class="grid-l" x1="${L}" x2="${w-R}" y1="${y}" y2="${y}"/><text x="${L-6}" y="${y+4}" text-anchor="end">${v>=1000?money(v/1000)+'k':money(v)}</text>`}
  let b='';data.forEach((d,i)=>{const x=L+step*i,cx=x+step/2,bh=d.revenue>0?Math.max(2,d.revenue/max*ih):0,y=T+ih-bh;
    const tip=`${d.title}\nยอดขาย ${money(d.revenue)} บาท\nกำไรขั้นต้น ${money(d.grossProfit)} บาท\n${d.bills} บิล`;
    b+=`<rect class="hit" data-tip="${esc(tip)}" tabindex="0" aria-label="${esc(tip.replace(/\n/g,' '))}" x="${x}" y="${T}" width="${step}" height="${ih+B}"/>`;
    if(bh){const r=Math.min(4,bw/2,bh),a=cx-bw/2;b+=`<path class="bar" pointer-events="none" d="M${a} ${T+ih}V${y+r}Q${a} ${y} ${a+r} ${y}H${a+bw-r}Q${a+bw} ${y} ${a+bw} ${y+r}V${T+ih}Z"/>`}
    if(d.show)b+=`<text pointer-events="none" x="${cx}" y="${h-7}" text-anchor="middle">${esc(d.label)}</text>`});
  return `<svg viewBox="0 0 ${w} ${h}" height="${h}" role="img" aria-label="กราฟยอดขาย">${g}${b}</svg>`;
}
function viewSummary(){
  const ms=inMonth(S.sales,ym),s=summarize(ms,inMonth(S.ledger,ym));
  const todayS=summarize(S.sales.filter(x=>x.date===today()));
  const brands=[...new Set(ms.filter(x=>x.lens).map(x=>x.lens.brand).concat(S.products.filter(p=>p.kind==='lens').map(p=>p.brand)))].filter(Boolean).sort();
  if(!lensBrand||!brands.includes(lensBrand))lensBrand=brands.includes('Hoya')?'Hoya':brands[0]||'';
  const lb=rank(ms,'lens',l=>l.brand).find(r=>r.key===lensBrand);
  const fr=rank(ms,'frame',f=>f.brand).sort((a,b)=>b.units-a.units||b.revenue-a.revenue);
  const lr=rank(ms,'lens',lensName).sort((a,b)=>b.profit-a.profit);

let F=null;

  return p+String(Math.max(0,...n)+1).padStart(3,'0');
}

     lens:{on:s?!!s.lens:true,manual:false,brand:'',model:'',coating:'',index:'',cost:'',price:'',productId:null,...(s?.lens||{})},

const moneyInputs=(p,it)=>`<div class="grid"><label>ราคาทุน<input id="${p}_cost" type="number" min="0" step="any" inputmode="decimal" value="${esc(it.cost)}"></label><label>ราคาขาย<input id="${p}_price" type="number" min="0" step="any" inputmode="decimal" value="${esc(it.price)}"></label></div>`;
function drawPart(p){
  const it=F[p],isL=p==='lens',fs=$(isL?'#fsLens':'#fsFrame');
  const head=`<legend><label class="check"><input id="${p}_on" type="checkbox" ${it.on?'checked':''}> ${isL?'เลนส์':'กรอบแว่น'}</label></legend>`;
  if(!it.on){fs.innerHTML=head;return}
  const list=S.products.filter(x=>x.kind===p);
  const keys=isL?['brand','model','coating','index']:['brand','model','color'];
  const labels={brand:isL?'1. ยี่ห้อเลนส์':'1. ยี่ห้อกรอบ',model:isL?'2. รุ่นเลนส์':'2. รุ่นกรอบ',coating:'3. Coating',index:'4. Index',color:'3. สี'};
  let f='';
  if(it.manual)f=keys.map(k=>`<label>${labels[k].replace(/^\d\. /,'')}<input id="${p}_${k}" value="${esc(it[k])}"></label>`).join('');
  else{let scope=list,ok=true;
    keys.forEach(k=>{
      f+=`<label>${labels[k]}<select id="${p}_${k}" ${ok?'':'disabled'}>${opts(ok?scope.map(x=>String(x[k]||'')):[],it[k],'เลือก')}</select></label>`;
      if(it[k])scope=scope.filter(x=>String(x[k]||'')===it[k]);else if(scope.some(x=>x[k]))ok=false})}
  fs.innerHTML=head+`<div class="grid">${f}</div>${moneyInputs(p,it)}<div class="dim">${!it.manual&&it.productId?'ดึงราคาจากฐานข้อมูลสินค้าแล้ว แก้เฉพาะบิลนี้ได้':''} <label class="check" style="display:inline-flex"><input id="${p}_manual" type="checkbox" ${it.manual?'checked':''}> สินค้านี้ไม่มีในฐานข้อมูล พิมพ์เอง</label></div>`;
}
function onPick(p,key,val){
  const it=F[p],isL=p==='lens',keys=isL?['brand','model','coating','index']:['brand','model','color'];
  it[key]=val;it.productId=null;
  keys.slice(keys.indexOf(key)+1).forEach(k=>it[k]='');
  const scopeOf=upto=>S.products.filter(x=>x.kind===p&&keys.slice(0,upto).every(k=>String(x[k]||'')===it[k]));
  for(let i=keys.indexOf(key)+1;i<keys.length;i++){const u=[...new Set(scopeOf(i).map(x=>String(x[keys[i]]||'')))];if(u.length===1)it[keys[i]]=u[0];else break}
  const m=keys.every((k,i)=>it[k]||scopeOf(i).every(x=>!x[k]))?scopeOf(keys.length):[];
  if(m.length===1){it.cost=m[0].cost;it.price=m[0].price;it.productId=m[0].id}else{it.cost='';it.price=''}
  drawPart(p);drawCalc();
}
function formSale(){
  const pick=p=>{const it=F[p];if(!it.on)return null;const{on,manual,...r}=it;return{...r,cost:num(it.cost),price:num(it.price)}};
  return {date:F.date,receipt:F.receipt.trim(),customer:F.customer.trim(),seller:F.seller.trim(),frame:pick('frame'),lens:pick('lens'),accessory:num(F.accessory),labor:num(F.labor),discount:num(F.discount),other:num(F.other),note:F.note.trim(),...(F.example?{example:true}:{})};
}
function drawCalc(){
  const c=calcSale(formSale());
  const row=(l,v,t)=>`<tr ${t?'class="tot"':''}><td>${l}</td><td class="r">${money(v)}</td></tr>`;
  $('#calc').innerHTML=`<table>${row('ขายกรอบ',c.fs)}${row('ขายเลนส์',c.ls)}${c.discount?row('ส่วนลด',-c.discount):''}${row('รวมยอดขาย',c.revenue,1)}${row('ทุนกรอบ',c.fc)}${row('ทุนเลนส์',c.lc)}${row('รวมต้นทุน',c.cogs,1)}${row('กำไรขั้นต้น',c.grossProfit,1)}${c.direct?row('หักค่าใช้จ่ายรายบิล',-c.direct)+row('กำไรของบิลนี้',c.profit,1):''}</table>${c.grossProfit<0?'<span class="chip loss">บิลนี้ขาดทุน ตรวจราคาอีกครั้ง</span>':''}`;
}
function validateSale(s,id){
  if(!s.date)return 'กรุณาเลือกวันที่ขาย';
  if(!s.receipt)return 'กรุณากรอกเลขที่ใบเสร็จ';
  if(S.sales.some(x=>x.receipt===s.receipt&&x.id!==id))return `เลขที่ใบเสร็จ ${s.receipt} มีอยู่แล้ว กรุณาใช้เลขอื่น`;
  if(!s.frame&&!s.lens)return 'เลือกกรอบหรือเลนส์อย่างน้อยหนึ่งอย่าง';
  if(s.frame&&!s.frame.brand)return 'กรุณาเลือกยี่ห้อกรอบ หรือเอาเครื่องหมายถูกที่กรอบแว่นออก';
  if(s.lens&&!s.lens.brand)return 'กรุณาเลือกยี่ห้อเลนส์ หรือเอาเครื่องหมายถูกที่เลนส์ออก';
  const nums=[s.accessory,s.labor,s.discount,s.other,s.frame?.cost,s.frame?.price,s.lens?.cost,s.lens?.price];
  if(nums.some(n=>(n||0)<0))return 'จำนวนเงินต้องไม่ติดลบ';
  const c=calcSale(s);if(c.discount>c.gross)return 'ส่วนลดมากกว่าราคาขายรวม';
  return '';
}

  const kind=p?.kind||(prodKind==='frame'?'frame':'lens');
  openDlg(`<form id="productForm" novalidate data-id="${esc(p?.id||'')}" data-ex="${p?.example?1:''}">${dlgHead(p?'แก้ไขสินค้า':'เพิ่มสินค้า')}
   <div class="grid"><label>ประเภท<select id="p_kind"><option value="lens" ${kind==='lens'?'selected':''}>เลนส์</option><option value="frame" ${kind==='frame'?'selected':''}>กรอบแว่น</option></select></label>
   <label>ยี่ห้อ<input id="p_brand" required value="${esc(p?.brand)}"></label><label>รุ่น<input id="p_model" required value="${esc(p?.model)}"></label></div>
   <div class="grid"><label data-for="lens">Coating<input id="p_coating" value="${esc(p?.coating)}"></label><label data-for="lens">Index<input id="p_index" list="dlIdx" value="${esc(p?.index)}"><datalist id="dlIdx"><option value="1.50"></option><option value="1.56"></option><option value="1.60"></option><option value="1.67"></option><option value="1.74"></option></datalist></label><label data-for="frame">สี<input id="p_color" value="${esc(p?.color)}"></label></div>
   <div class="grid"><label>ราคาทุน<input id="p_cost" type="number" min="0" step="any" inputmode="decimal" value="${esc(p?.cost)}"></label><label>ราคาขาย<input id="p_price" type="number" min="0" step="any" inputmode="decimal" value="${esc(p?.price)}"></label></div>
   ${dlgFoot(p?.id,'products')}</form>`);
  syncKind();
}
function syncKind(){const k=$('#p_kind').value;dlg.querySelectorAll('[data-for]').forEach(n=>n.hidden=n.dataset.for!==k)}
function openPaste(){
  openDlg(`<form id="pasteForm" novalidate>${dlgHead('วางข้อมูลสินค้าจาก Excel')}
   <p class="dim" style="margin:0">คัดลอกจาก Excel หรือ Google Sheets โดยเรียง 7 คอลัมน์: ประเภท, ยี่ห้อ, รุ่น, Coating หรือสี, Index, ทุน, ขาย สินค้าที่มีอยู่แล้วจะอัปเดตราคาให้ ไม่เพิ่มซ้ำ</p>
   <label>ข้อมูล<textarea id="pasteText" rows="9" placeholder="เลนส์&#9;Hoya&#9;Nulux&#9;Hi-Vision&#9;1.60&#9;1500&#9;3900"></textarea></label>
   <div id="pasteInfo" class="dim"></div><div class="error" id="fErr" role="alert"></div>
   <div class="dfoot"><div><button type="button" class="btn" data-act="close">ยกเลิก</button><button class="btn primary">นำเข้า</button></div></div></form>`);
}
const LEDGER_CATS=['ค่าเช่า','เงินเดือน','ค่าน้ำ-ไฟ','ค่าอินเทอร์เน็ต','การตลาด','อุปกรณ์สำนักงาน','ค่าธรรมเนียมบัตร','อื่น ๆ'];
function openLedger(e){
  openDlg(`<form id="ledgerForm" novalidate data-id="${esc(e?.id||'')}" data-ex="${e?.example?1:''}">${dlgHead(e?'แก้ไขรายการ':'เพิ่มรายรับ-รายจ่าย')}
   <div class="grid"><label>ประเภท<select id="l_type"><option value="expense" ${e?.type!=='income'?'selected':''}>รายจ่ายของร้าน</option><option value="income" ${e?.type==='income'?'selected':''}>รายรับอื่น</option></select></label>
   <label>วันที่<input id="l_date" type="date" value="${esc(e?.date||(ym===today().slice(0,7)?today():ym+'-01'))}"></label>
   <label>หมวด<input id="l_category" list="dlCat" value="${esc(e?.category)}"><datalist id="dlCat">${LEDGER_CATS.map(c=>`<option value="${c}"></option>`).join('')}</datalist></label>
   <label>จำนวนเงิน (บาท)<input id="l_amount" type="number" min="0" step="any" inputmode="decimal" value="${esc(e?.amount)}"></label></div>
   <label>รายละเอียด<input id="l_title" value="${esc(e?.title)}"></label>${dlgFoot(e?.id,'ledger')}</form>`);
}
function openEvent(e){
  const kinds=['นัดหมาย','ตรวจสายตา','นัดรับแว่น','กิจกรรมร้าน'];
  openDlg(`<form id="eventForm" novalidate data-id="${esc(e?.id||'')}" data-ex="${e?.example?1:''}">${dlgHead(e?'แก้ไขกิจกรรม':'เพิ่มกิจกรรม')}
   <div class="grid"><label>วันที่<input id="e_date" type="date" value="${esc(e?.date||selDay)}"></label><label>เวลา<input id="e_time" type="time" value="${esc(e?.time)}"></label><label>ประเภท<select id="e_kind">${kinds.map(k=>`<option ${e?.kind===k?'selected':''}>${k}</option>`).join('')}</select></label></div>
   <label>หัวข้อ<input id="e_title" value="${esc(e?.title)}"></label><label>หมายเหตุ<input id="e_note" value="${esc(e?.note)}"></label>${dlgFoot(e?.id,'events')}</form>`);
}

/* ---------- บันทึก ---------- */
async function doSave(form,col,id,body){
  const btn=form.querySelector('button.primary');btn.disabled=true;
  try{await put(col,id||newId(),body);dlg.close();toast('บันทึกแล้ว')}
  catch(e){$('#fErr').textContent=errText(e);btn.disabled=false}
}
dlg.addEventListener('submit',async ev=>{
  ev.preventDefault();const f=ev.target,err=m=>{$('#fErr').textContent=m},id=f.dataset.id,ex=f.dataset.ex?{example:true}:{};
  const v=i=>$('#'+i).value.trim();
  if(f.id==='saleForm'){const s=formSale(),m=validateSale(s,F.id);if(m)return err(m);selDay=s.date;await doSave(f,'sales',F.id,s)}
  if(f.id==='productForm'){const k=v('p_kind');if(!v('p_brand')||!v('p_model'))return err('กรุณากรอกยี่ห้อและรุ่น');if(num(v('p_cost'))<0||num(v('p_price'))<0)return err('ราคาต้องไม่ติดลบ');
    const b={kind:k,brand:v('p_brand'),model:v('p_model'),cost:num(v('p_cost')),price:num(v('p_price')),...ex};if(k==='lens'){b.coating=v('p_coating');b.index=v('p_index')}else b.color=v('p_color');
    if(S.products.some(p=>p.id!==id&&pKey(p)===pKey(b)))return err('มีสินค้านี้อยู่แล้ว');await doSave(f,'products',id,b)}
  if(f.id==='ledgerForm'){if(!v('l_date'))return err('กรุณาเลือกวันที่');if(!(num(v('l_amount'))>0))return err('กรุณากรอกจำนวนเงินมากกว่า 0');await doSave(f,'ledger',id,{type:v('l_type'),date:v('l_date'),category:v('l_category')||'อื่น ๆ',title:v('l_title'),amount:num(v('l_amount')),...ex})}
  if(f.id==='eventForm'){if(!v('e_date')||!v('e_title'))return err('กรุณากรอกวันที่และหัวข้อ');selDay=v('e_date');await doSave(f,'events',id,{date:v('e_date'),time:v('e_time'),kind:v('e_kind'),title:v('e_title'),note:v('e_note'),...ex})}
  if(f.id==='pasteForm'){const{items,errors}=parsePasted($('#pasteText').value);if(errors.length)return err(errors.slice(0,3).join(' / '));if(!items.length)return err('ยังไม่มีข้อมูลให้นำเข้า');
    const btn=f.querySelector('button.primary');btn.disabled=true;
    try{let i=0;for(const it of items){const old=S.products.find(p=>pKey(p)===pKey(it));await put('products',old?old.id:newId(),it);$('#pasteInfo').textContent=`นำเข้าแล้ว ${++i}/${items.length}`}dlg.close();toast(`นำเข้าสินค้า ${items.length} รายการแล้ว`)}
    catch(e){err(errText(e)+' รายการที่นำเข้าแล้วยังอยู่ในระบบ');btn.disabled=false}}
});
dlg.addEventListener('input',ev=>{
  const t=ev.target;
  if(t.id==='p_kind')return syncKind();
  if(!F||!$('#saleForm'))return;
  const m=t.id.match(/^(frame|lens)_(.+)$/);
  if(m){if(m[2]==='on'||m[2]==='manual'||t.tagName==='SELECT')return;F[m[1]][m[2]]=t.value;drawCalc();return}
  if(t.id.startsWith('f_')){const k=t.id.slice(2);F[k]=t.value;
    if(k==='receipt')F.autoReceipt=false;
    if(k==='date'&&F.autoReceipt&&t.value){F.receipt=nextReceipt(t.value);$('#f_receipt').value=F.receipt}
    drawCalc()}
});
dlg.addEventListener('change',ev=>{
  const t=ev.target;if(!F||!$('#saleForm'))return;
  const m=t.id.match(/^(frame|lens)_(.+)$/);if(!m)return;
  if(m[2]==='on'){F[m[1]].on=t.checked;drawPart(m[1]);drawCalc()}
  else if(m[2]==='manual'){F[m[1]].manual=t.checked;F[m[1]].productId=null;drawPart(m[1])}
  else if(t.tagName==='SELECT')onPick(m[1],m[2],t.value);
});

/* ---------- ปุ่มและเหตุการณ์ ---------- */
document.addEventListener('click',async ev=>{
  const b=ev.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,id=b.dataset.id;
  const find=c=>S[c].find(x=>x.id===id);
  if(a==='ym'){ym=shiftYm(ym,+b.dataset.n);if(selDay.slice(0,7)!==ym)selDay=ym===today().slice(0,7)?today():ym+'-01';render()}
  if(a==='day'){selDay=b.dataset.k;if(selDay.slice(0,7)!==ym)ym=selDay.slice(0,7);render()}
  if(a==='new-sale')openSale(null,b.dataset.date||(ym===today().slice(0,7)?today():ym+'-01'));
  if(a==='edit-sale')openSale(find('sales'));
  if(a==='new-product')openProduct();if(a==='edit-product')openProduct(find('products'));
  if(a==='paste')openPaste();
  if(a==='new-ledger')openLedger();if(a==='edit-ledger')openLedger(find('ledger'));
  if(a==='new-event')openEvent();if(a==='edit-event')openEvent(find('events'));
  if(a==='close')dlg.close();
  if(a==='pkind'){prodKind=b.dataset.k;render()}
  if(a==='chart'){chartMode=b.dataset.m;render()}
  if(a==='delete'){
    if(b.dataset.armed){b.disabled=true;try{await del(b.dataset.col,id);dlg.close();toast('ลบแล้ว')}catch(e){$('#fErr').textContent=errText(e);b.disabled=false}}
    else{b.dataset.armed='1';b.textContent='กดอีกครั้งเพื่อยืนยันการลบ'}
  }
  if(a==='clear-ex'){
    if(!confirmEx){confirmEx=true;render();return}
    confirmEx=false;try{for(const c of COLS)for(const x of S[c].filter(y=>y.example))await del(c,x.id);toast('ลบข้อมูลตัวอย่างแล้ว')}catch(e){toast(errText(e))}
  }
  if(a==='export')exportCsv();
  if(a==='retry'){mode=mode==='stale'?'live':'loading';render();refresh()}
  if(a==='lock')lockApp();
  if(a==='backup'){saveFile(`social-eyewear-backup-${today()}.json`,JSON.stringify({version:1,exportedAt:new Date().toISOString(),data:S},null,1),'application/json');toast('ดาวน์โหลดไฟล์สำรองแล้ว')}
});
document.addEventListener('keydown',ev=>{if(ev.key==='Enter'&&ev.target.matches('tr[data-act]'))ev.target.click()});
document.addEventListener('input',ev=>{
  if(ev.target.id==='salesQ'){salesQ=ev.target.value;$('#salesList').innerHTML=salesList()}
  if(ev.target.id==='prodQ'){prodQ=ev.target.value;$('#prodList').innerHTML=prodList()}
  if(ev.target.id==='lensBrand'){lensBrand=ev.target.value;render()}
});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(validTab(h)){tab=h;render();window.scrollTo(0,0)}});
let rz;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(drawChart,120)});
const tip=$('#tip');
function showTip(t,x,y){tip.textContent=t.dataset.tip;tip.hidden=false;const r=tip.getBoundingClientRect();tip.style.left=Math.max(8,Math.min(innerWidth-r.width-8,x-r.width/2))+'px';tip.style.top=Math.max(8,y-r.height-12)+'px'}
document.addEventListener('pointermove',ev=>{const t=ev.target.closest&&ev.target.closest('[data-tip]');if(t)showTip(t,ev.clientX,ev.clientY);else tip.hidden=true});
document.addEventListener('focusin',ev=>{const t=ev.target.closest&&ev.target.closest('[data-tip]');if(t){const r=t.getBoundingClientRect();showTip(t,r.left+r.width/2,r.top+40)}});
document.addEventListener('focusout',()=>tip.hidden=true);
window.addEventListener('scroll',()=>tip.hidden=true,{passive:true});

function saveFile(name,text,type){
  const u=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);
}
document.addEventListener('submit',ev=>{if(ev.target.id==='pinForm'){ev.preventDefault();checkPin()}});
document.addEventListener('input',ev=>{if(ev.target.id==='pinInput'){ev.target.value=ev.target.value.replace(/\D/g,'');if(ev.target.value.length===4)checkPin()}});
document.addEventListener('change',async ev=>{
  if(ev.target.id!=='restoreFile'||!ev.target.files[0])return;
  try{
    const j=JSON.parse(await ev.target.files[0].text()),d=j&&j.data;
    if(!d||!COLS.every(c=>Array.isArray(d[c])))throw new Error('format');
    let n=0;for(const c of COLS)for(const r of d[c]){if(!r||typeof r.id!=='string')continue;await put(c,r.id,r);n++}
    toast(`กู้คืนแล้ว ${n} รายการ`);
  }catch(e){toast(e.message==='format'||e instanceof SyntaxError?'ไฟล์นี้ไม่ใช่ไฟล์สำรองของแอป':errText(e))}
  ev.target.value='';
});
function exportCsv(){
  const rows=inMonth(S.sales,ym).sort(byDateDesc);
  if(!rows.length)return toast('เดือนนี้ยังไม่มีรายการให้ส่งออก');
  const safe=v=>{let s=String(v??'');if(typeof v==='string'&&/^[=+\-@\t\r]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'};
  const h=['วันที่','ใบเสร็จ','ลูกค้า','พนักงานขาย','กรอบ','ทุนกรอบ','ขายกรอบ','เลนส์','Coating','Index','ทุนเลนส์','ขายเลนส์','ค่าอุปกรณ์','ค่าแรง','ส่วนลด','อื่น ๆ','ยอดขาย','ต้นทุนสินค้า','กำไรขั้นต้น','กำไรของบิล'];
  const csv='﻿'+[h.map(safe).join(',')].concat(rows.map(s=>{const c=calcSale(s);return [s.date,s.receipt,s.customer,s.seller,s.frame?frameName(s.frame):'',c.fc,c.fs,s.lens?lensName(s.lens):'',s.lens?.coating||'',s.lens?.index||'',c.lc,c.ls,num(s.accessory),num(s.labor),c.discount,num(s.other),c.revenue,c.cogs,c.grossProfit,c.profit].map(safe).join(',')})).join('\r\n');
  saveFile(`social-eyewear-sales-${ym}.csv`,csv,'text/csv;charset=utf-8');toast('ดาวน์โหลด CSV แล้ว');
}
boot();
</script>
