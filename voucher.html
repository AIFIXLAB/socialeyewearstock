<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>คูปองเลนส์ · Social Eyewear</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600&family=Bai+Jamjuree:wght@500;600;700&display=swap">
<style>
/* Layout: top bar + tabs over a single working column; same tokens and fonts as the main app. */
:root{
  --bg:#f1f4f4;--panel:#fff;--panel2:#e8eeee;--fg:#16242a;--muted:#5a6b72;--line:#d3dcdd;
  --accent:#0b6f62;--accent-fg:#fff;--accent-soft:#d8efea;--loss:#b3322c;--loss-soft:#f9e3e1;--cost:#96600a;--cost-soft:#f8ecd3;--profit:#12784a;
  --display:"Bai Jamjuree","Anuphan",system-ui,sans-serif;--body:"Anuphan","Noto Sans Thai",system-ui,sans-serif;
  padding-top:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1719;--panel:#172225;--panel2:#20302f;--fg:#e6eeee;--muted:#9bafb3;--line:#2d3f42;
  --accent:#4fcbb6;--accent-fg:#06211d;--accent-soft:#163a35;--loss:#f2918b;--loss-soft:#44201e;--cost:#e4b35b;--cost-soft:#3b2d12;--profit:#62d39a;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1719;--panel:#172225;--panel2:#20302f;--fg:#e6eeee;--muted:#9bafb3;--line:#2d3f42;
  --accent:#4fcbb6;--accent-fg:#06211d;--accent-soft:#163a35;--loss:#f2918b;--loss-soft:#44201e;--cost:#e4b35b;--cost-soft:#3b2d12;--profit:#62d39a;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--body);font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);line-height:1.25;margin:0;text-wrap:balance}
h1{font-size:1.4rem}h2{font-size:1.05rem}h3{font-size:.95rem}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{background:var(--panel);border-bottom:1px solid var(--line);padding-block:10px 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));position:sticky;top:env(safe-area-inset-top,0px);z-index:10}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--panel);z-index:11}
.top-in{max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.top-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.top-row h1{flex:1;min-width:0}
.back{color:var(--accent);text-decoration:none;font-weight:600;font-size:.9rem;white-space:nowrap}
.tabs{display:flex;gap:2px;overflow-x:auto}
.tabs a{padding:8px 11px;border-bottom:3px solid transparent;color:var(--muted);text-decoration:none;font-weight:500;white-space:nowrap}
.tabs a[aria-current="page"]{color:var(--accent);border-color:var(--accent);font-weight:600}
main{max-width:1320px;margin:0 auto;padding-block:16px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0;display:flex;flex-direction:column;gap:10px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:8px 13px;cursor:pointer;font-weight:500;min-height:40px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;color:var(--fg)}
.btn:hover{background:var(--panel2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
.btn.danger{color:var(--loss);border-color:var(--loss)}
.btn.sm{padding:4px 10px;min-height:32px;font-size:.86rem}
.btn:disabled{opacity:.55;cursor:default}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.between{justify-content:space-between}
input,select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:7px 9px;min-height:40px;width:100%;min-width:0}
textarea{resize:vertical;min-height:60px}
input[type=date]{-webkit-appearance:none;appearance:none;display:block}
label{display:flex;flex-direction:column;gap:3px;font-size:.82rem;color:var(--muted);min-width:0}
label>input,label>select,label>textarea{font-size:.95rem;color:var(--fg)}
label.inline{flex-direction:row;align-items:center;gap:8px;font-size:.92rem;color:var(--fg)}
label.inline input{width:20px;min-height:20px}
.req::after{content:" *";color:var(--loss)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.notice{background:var(--cost-soft);border-radius:8px;padding:10px 12px;font-size:.9rem;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}
.notice.err{background:var(--loss-soft)}
.notice.ok{background:var(--accent-soft)}
.error{color:var(--loss);font-weight:500;font-size:.9rem;min-height:1.2em}
.dim{color:var(--muted);font-size:.85rem}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
.tile{padding:12px 14px;box-shadow:0 0 0 .5px var(--line);min-width:0}
.tile span{display:block;color:var(--muted);font-size:.8rem}
.tile b{display:block;font:600 1.35rem var(--display);overflow-wrap:anywhere}
.bal{font:700 1.5rem var(--display);color:var(--accent)}
.neg{color:var(--loss)!important}
.rx{width:100%;border-collapse:collapse}
.rx th{font-size:.78rem;color:var(--muted);font-weight:600;padding:4px;text-align:center}
.rx th:first-child{text-align:left;width:76px}
.rx td{padding:3px}
.rx input{text-align:center;padding:6px 4px}
.tw{overflow-x:auto}
table.list{width:100%;border-collapse:collapse}
table.list th{font-size:.78rem;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.list td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
table.list tr.click{cursor:pointer}table.list tr.click:hover td{background:var(--panel2)}
table.list tfoot td{font-weight:600;border-bottom:0}
.r{text-align:right;white-space:nowrap}
.nw{white-space:nowrap}
.chip{display:inline-block;border-radius:5px;padding:0 7px;font-size:.75rem;font-weight:600;white-space:nowrap;background:var(--panel2);color:var(--muted)}
.chip.active{background:var(--accent-soft);color:var(--accent)}
.chip.cancelled{background:var(--loss-soft);color:var(--loss)}
.chip.refund{background:var(--cost-soft);color:var(--cost)}
.empty{color:var(--muted);text-align:center;padding:26px 10px}
.logs{display:flex;flex-direction:column;gap:6px;font-size:.88rem}
.logs>div{border-left:3px solid var(--line);padding-left:10px}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;margin:0}
.kv dt{color:var(--muted);font-size:.86rem}
.kv dd{margin:0;overflow-wrap:anywhere}
.pin{max-width:340px;width:100%;margin:12vh auto 0;text-align:center}
.pin input{text-align:center;font-size:1.6rem;letter-spacing:.5em;min-height:52px}
.att{max-width:100%;max-height:420px;border-radius:8px;border:1px solid var(--line);background:#fff}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:.9rem;max-width:calc(100vw - 32px)}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--fg);padding:0;width:min(720px,calc(100vw - 24px));max-height:calc(100dvh - 24px)}
dialog::backdrop{background:rgba(8,18,20,.55)}
dialog .in{padding:16px;display:flex;flex-direction:column;gap:12px}
.print-only{display:none}
@media(max-width:560px){.hide-s{display:none}h1{font-size:1.15rem}}
@page{size:A4;margin:12mm}
@media print{
  body{background:#fff;color:#000;font-size:10pt}
  .top,.no-print,#toast,dialog{display:none!important}
  main{padding:0;max-width:none}
  .panel{border:0;padding:0}
  .print-only{display:block}
  table.list th,table.list td{padding:3px 5px;border-bottom:.2mm solid #999;color:#000}
  tr.click{cursor:auto}
  .chip{background:none!important;color:#000!important;padding:0}
}
</style>
</head>
<body>
<header class="top" id="top" hidden>
  <div class="top-in">
    <div class="top-row"><a class="back" href="index.html">‹ โปรแกรมหลัก</a><h1>คูปองเลนส์</h1><button class="btn sm" id="lockBtn" type="button">ล็อกหน้าจอ</button></div>
    <nav class="tabs" id="tabs" aria-label="เมนูคูปองเลนส์"></nav>
  </div>
</header>
<main id="main"></main>
<dialog id="dlg"></dialog>
<div id="toast" role="status" hidden></div>
<script src="config.js"></script>
<script>
'use strict';
const $=(s,r=document)=>r.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=parseFloat(String(v??'').replace(/,/g,''));return Number.isFinite(n)?n:0};
const r2=n=>Math.round((n+Number.EPSILON)*100)/100;
const money=n=>r2(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const pDate=k=>{const[y,m,d]=String(k).slice(0,10).split('-').map(Number);return new Date(y,m-1,d)};
const thShort=k=>k?pDate(k).toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'2-digit'}):'';
const thDateTime=t=>t?new Date(t).toLocaleString('th-TH',{day:'numeric',month:'short',year:'2-digit',hour:'2-digit',minute:'2-digit'}):'';
const TH_MONTH=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const uuid=()=>crypto.randomUUID?crypto.randomUUID():'10000000-1000-4000-8000-100000000000'.replace(/[018]/g,c=>(+c^crypto.getRandomValues(new Uint8Array(1))[0]&15>>+c/4).toString(16));
function normPower(v){
  const t=String(v??'').trim().replace(/[−–]/g,'-');if(!t)return '';
  if(/^(pl|plano)$/i.test(t))return 'Plano';
  if(/^[+-]?(\d+(\.\d+)?|\.\d+)$/.test(t)){const n=parseFloat(t);return n===0?'0.00':(n>0?'+':'-')+Math.abs(n).toFixed(2)}
  return t;
}
const normAx=v=>{v=String(v??'').trim();const n=v.replace(/[^\d]/g,'');return n===''?v:String(parseInt(n,10))};
const rxText=(s,c,a)=>[s,c,a?'x'+a:''].filter(Boolean).join(' ')||'–';
const LENS_TYPES=['Single Vision','Progressive','Bifocal','Office / Workspace','Myopia Control'];
const INDEXES=['1.50','1.56','1.60','1.67','1.74'];

/* ---------- ฐานข้อมูล (รหัส 4 หลักเดียวกับโปรแกรมหลัก) ---------- */
const CFG=window.SE_CONFIG||{};const PIN_KEY='social-eyewear-pin';let PIN='';
function readPin(){try{return sessionStorage.getItem(PIN_KEY)||''}catch(_){return ''}}
function savePin(v){try{v?sessionStorage.setItem(PIN_KEY,v):sessionStorage.removeItem(PIN_KEY)}catch(_){}}
async function rpc(fn,args){
  if(!CFG.supabaseUrl||!CFG.supabaseAnonKey)throw Object.assign(new Error('config'),{code:'config'});
  let res;
  try{res=await fetch(CFG.supabaseUrl.replace(/\/$/,'')+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:CFG.supabaseAnonKey,'Content-Type':'application/json'},body:JSON.stringify(args)})}
  catch(e){throw Object.assign(new Error('net'),{code:'net'})}
  if(!res.ok)throw Object.assign(new Error('http '+res.status),{code:res.status===404?'missing':'http'});
  const j=await res.json();
  if(!j.ok)throw Object.assign(new Error(j.message||j.error),{code:j.error,msg:j.message,data:j});
  return j;
}
function errText(e){
  if(!e)return 'เกิดข้อผิดพลาด';if(e.msg)return e.msg;
  if(e.code==='bad_pin')return 'รหัสเปลี่ยนไปแล้ว กรุณาใส่รหัสใหม่';
  if(e.code==='locked')return 'ใส่รหัสผิดหลายครั้ง ระบบล็อกชั่วคราว 30 นาที';
  if(e.code==='missing')return 'ยังไม่ได้สร้างตารางคูปอง ต้องรัน SQL คูปองเลนส์ใน Supabase ก่อน';
  if(e.code==='config')return 'ยังไม่ได้ตั้งค่า Supabase ใน config.js';
  return 'เชื่อมต่อไม่ได้ ตรวจอินเทอร์เน็ตแล้วลองอีกครั้ง';
}
function guard(e){if(e&&e.code==='bad_pin'){PIN='';savePin('');showPin('กรุณาใส่รหัสอีกครั้ง');return true}return false}
function getEditor(){try{return localStorage.getItem('rb-editor')||''}catch(_){return ''}}
function setEditor(v){try{localStorage.setItem('rb-editor',v)}catch(_){}}

/* ---------- สถานะ ---------- */
let COMP=[],view='overview',U=null,B=null;
const LS={usages:{f:{company_id:'',q:'',date_from:'',date_to:'',lens_type:'',lens_index:'',status:'all'},rows:[],count:0,net:0,pairs:0,loaded:false,err:''},
          purchases:{f:{company_id:'',q:'',date_from:'',date_to:'',status:'all'},rows:[],count:0,total:0,loaded:false,err:''}};
let REPORT={year:new Date().getFullYear(),company:'',data:null,err:''};
const comp=id=>COMP.find(c=>c.id===id);
const activeComps=()=>COMP.filter(c=>c.active);
async function loadOverview(){const j=await rpc('vc_overview',{p_pin:PIN});COMP=j.companies||[]}
function blankU(keep){return {id:uuid(),is_new:true,company_id:keep?.company_id||(activeComps()[0]?.id||''),use_date:keep?.use_date||today(),bill_no:keep?.bill_no||'',r_sph:'',r_cyl:'',r_ax:'',l_sph:'',l_cyl:'',l_ax:'',lens_type:keep?.lens_type||'',lens_index:'',lens_model:'',pairs:'1',amount:'',note:'',revision:null}}
function blankB(cid){return {id:uuid(),is_new:true,company_id:cid||(activeComps()[0]?.id||''),purchase_date:today(),doc_no:'',amount:'',note:'',attachment:'',revision:null}}

/* ---------- หน้าจอ ---------- */
const TABS=[['overview','ภาพรวม'],['use','ตัดคูปอง'],['buy','เพิ่มยอดซื้อ'],['usages','ประวัติการตัด'],['purchases','ประวัติการซื้อ'],['report','รายงาน'],['companies','บริษัทเลนส์']];
function render(){
  $('#top').hidden=false;
  $('#tabs').innerHTML=TABS.map(([k,l])=>`<a href="#${k}" ${k===view?'aria-current="page"':''}>${l}</a>`).join('');
  const m=$('#main');
  m.innerHTML=({overview:viewOverview,use:viewUse,buy:viewBuy,usages:viewUsages,purchases:viewPurchases,report:viewReport,companies:viewCompanies}[view]||viewOverview)();
  if(view==='usages'&&!LS.usages.loaded)loadList('usages');
  if(view==='purchases'&&!LS.purchases.loaded)loadList('purchases');
  if(view==='report'&&!REPORT.data&&!REPORT.err)loadReport();
  if(view==='use')updateUseBal();
}
const editorField=(id)=>`<label><span class="req">ผู้บันทึก</span><input id="${id}" value="${esc(getEditor())}" autocomplete="name"></label>`;
const compOpts=(sel,all,onlyActive=true)=>(all?`<option value="">ทุกบริษัท</option>`:'')+(onlyActive?activeComps():COMP).concat(sel&&!activeComps().some(c=>c.id===sel)&&comp(sel)?[comp(sel)]:[]).filter((c,i,a)=>a.indexOf(c)===i).map(c=>`<option value="${c.id}" ${c.id===sel?'selected':''}>${esc(c.name)}${c.active?'':' (ปิดใช้งาน)'}</option>`).join('');

/* ----- ภาพรวม ----- */
function viewOverview(){
  const t=COMP.reduce((a,c)=>({p:a.p+num(c.purchased),u:a.u+num(c.used)-num(c.refunded),b:a.b+num(c.balance),n:a.n+num(c.usage_count),pr:a.pr+num(c.pairs)}),{p:0,u:0,b:0,n:0,pr:0});
  return `<div class="tiles"><div class="tile"><span>ยอดซื้อคูปองรวม</span><b>${money(t.p)}</b></div><div class="tile"><span>ยอดตัดคูปองรวม (หักคืนยอดแล้ว)</span><b>${money(t.u)}</b></div><div class="tile"><span>เครดิตคงเหลือรวม</span><b class="${t.b<0?'neg':''}">${money(t.b)}</b></div><div class="tile"><span>รายการที่ตัดแล้ว</span><b>${t.n} รายการ</b><span>${t.pr} คู่</span></div></div>
  <section class="panel"><div class="tools between"><h2>คงเหลือแยกตามบริษัท</h2><div class="tools no-print"><a class="btn primary" href="#use">ตัดคูปอง</a><a class="btn" href="#buy">เพิ่มยอดซื้อ</a></div></div>
   ${COMP.length?`<div class="tw"><table class="list"><thead><tr><th>บริษัท</th><th class="r">ซื้อคูปอง</th><th class="r">ใช้ไป</th><th class="r hide-s">คืนยอด</th><th class="r">คงเหลือ</th><th class="no-print"></th></tr></thead><tbody>${COMP.map(c=>`<tr><td><b>${esc(c.name)}</b>${c.active?'':' <span class="chip">ปิดใช้งาน</span>'}<div class="dim">ตัด ${c.usage_count} รายการ · ${c.pairs} คู่</div></td><td class="r">${money(num(c.purchased))}</td><td class="r">${money(num(c.used))}</td><td class="r hide-s">${num(c.refunded)?money(num(c.refunded)):'–'}</td><td class="r"><b class="${num(c.balance)<0?'neg':''}">${money(num(c.balance))}</b></td><td class="r no-print">${c.active?`<button class="btn sm" data-act="go-use" data-id="${c.id}">ตัด</button> <button class="btn sm" data-act="go-buy" data-id="${c.id}">ซื้อเพิ่ม</button>`:''}</td></tr>`).join('')}</tbody>
   <tfoot><tr><td>รวม</td><td class="r">${money(t.p)}</td><td class="r">${money(COMP.reduce((a,c)=>a+num(c.used),0))}</td><td class="r hide-s">${money(COMP.reduce((a,c)=>a+num(c.refunded),0))}</td><td class="r ${t.b<0?'neg':''}">${money(t.b)}</td><td class="no-print"></td></tr></tfoot></table></div>`:'<div class="empty">ยังไม่มีบริษัทเลนส์ เพิ่มได้ที่แท็บบริษัทเลนส์</div>'}
   <p class="dim" style="margin:0">คงเหลือ = ซื้อคูปอง − ใช้ไป + คืนยอด คำนวณจากประวัติทุกรายการ ไม่รวมรายการที่ยกเลิก</p></section>`;
}

/* ----- ตัดคูปอง ----- */
function viewUse(){
  if(!U)U=blankU();const u=U,edit=!u.is_new;
  if(!activeComps().length&&!edit)return '<section class="panel"><div class="empty">ยังไม่มีบริษัทที่เปิดใช้งาน เพิ่มบริษัทที่แท็บบริษัทเลนส์ก่อน</div></section>';
  const rx=(e,lab)=>`<tr><th>${lab}</th><td><input id="u_${e}_sph" inputmode="decimal" value="${esc(u[e+'_sph'])}" aria-label="SPH ${lab}"></td><td><input id="u_${e}_cyl" inputmode="decimal" value="${esc(u[e+'_cyl'])}" aria-label="CYL ${lab}"></td><td><input id="u_${e}_ax" inputmode="numeric" value="${esc(u[e+'_ax'])}" aria-label="AX ${lab}"></td></tr>`;
  return `<section class="panel">${edit?`<div class="notice"><span>กำลังแก้ไขรายการตัดคูปอง บิล <b>${esc(u.bill_no||'–')}</b> ยอดคงเหลือจะคำนวณใหม่ให้อัตโนมัติ</span><button type="button" class="btn sm" data-act="use-cancel-edit">ยกเลิกการแก้ไข</button></div>`:''}
   <div class="tools between"><h2>${edit?'แก้ไขรายการตัดคูปอง':'ตัดคูปองเลนส์ (กรอกจากบิลบริษัททีละคู่)'}</h2></div>
   <div class="grid"><label><span class="req">บริษัทเลนส์</span><select id="u_company_id">${compOpts(u.company_id)}</select></label>

function readImage(file,cb){
  const img=new Image(),url=URL.createObjectURL(file);
  img.onload=()=>{const k=Math.min(1,1600/Math.max(img.width,img.height)),w=Math.round(img.width*k),h=Math.round(img.height*k),cv=document.createElement('canvas');cv.width=w;cv.height=h;
    const g=cv.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,w,h);g.drawImage(img,0,0,w,h);URL.revokeObjectURL(url);
    let q=.8,d=cv.toDataURL('image/jpeg',q);while(d.length>1300000&&q>.4){q-=.1;d=cv.toDataURL('image/jpeg',q)}
    if(d.length>1400000)return toast('รูปใหญ่เกินไป ลองถ่ายใหม่ให้เล็กลง');cb(d)};
  img.onerror=()=>{URL.revokeObjectURL(url);toast('เปิดไฟล์รูปนี้ไม่ได้')};img.src=url;
}

  if(a==='buy-save')saveBuy();if(a==='buy-force')saveBuy(true,false);if(a==='buy-over')saveBuy(true,true);
  if(a==='buy-file-del'){B.attachment='';B.att_changed=true;render()}
  if(a==='buy-cancel-edit'){B=null;history.back()}
  if(a==='open-usage')openDetail('usage',id);if(a==='open-purchase')openDetail('purchase',id);
  if(a==='dlg-close')d.close();
  if(a==='usage-edit'){const r=d._data.record;U={...Object.fromEntries(Object.entries(r).map(([k,v])=>[k,v??''])),is_new:false,pairs:String(r.pairs),amount:String(num(r.amount)),revision:r.revision,orig_amount:num(r.amount),orig_company:r.company_id};d.close();location.hash='use';render()}
  if(a==='purchase-edit'){const r=d._data.record;B={id:r.id,is_new:false,company_id:r.company_id,purchase_date:r.purchase_date,doc_no:r.doc_no||'',amount:String(num(r.amount)),note:r.note||'',attachment:r.attachment||'',revision:r.revision};d.close();location.hash='buy';render()}
  if(a==='usage-refund-open')$('#dAct').innerHTML=actForm('refund');
  if(a==='usage-cancel-open')$('#dAct').innerHTML=actForm('usage');
  if(a==='purchase-cancel-open')$('#dAct').innerHTML=actForm('purchase');
  if(a==='usage-refund')doAction('refund');if(a==='usage-cancel')doAction('usage');if(a==='purchase-cancel')doAction('purchase');if(a==='purchase-cancel-over')doAction('purchase',true);
  if(a==='search-usages')readFilters('usages');if(a==='search-purchases')readFilters('purchases');
  if(a==='clear-usages'){LS.usages.f={company_id:'',q:'',date_from:'',date_to:'',lens_type:'',lens_index:'',status:'all'};LS.usages.loaded=false;render()}
  if(a==='clear-purchases'){LS.purchases.f={company_id:'',q:'',date_from:'',date_to:'',status:'all'};LS.purchases.loaded=false;render()}
  if(a==='more-usages')loadList('usages',true);if(a==='more-purchases')loadList('purchases',true);
  if(a==='csv-usages')exportCsv('usages');if(a==='csv-purchases')exportCsv('purchases');if(a==='csv-report')reportCsv();
  if(a==='print')window.print();if(a==='backup')backup();
  if(a==='company-add'){const n=$('#c_new').value.trim();if(!n)return $('#cErr').textContent='กรุณาใส่ชื่อบริษัท';saveCompany({name:n,active:true})}
  if(a==='company-rename'){const c=comp(id);saveCompany({id,name:$('#cn_'+id).value.trim(),active:c.active})}
  if(a==='company-toggle'){const c=comp(id);saveCompany({id,name:c.name,active:!c.active})}
});
document.addEventListener('keydown',ev=>{if(ev.key==='Enter'&&ev.target.matches('tr[data-act]'))ev.target.click()});
document.addEventListener('submit',ev=>{ev.preventDefault();if(ev.target.id==='pinForm')checkPin();if(ev.target.id==='fUsages')readFilters('usages');if(ev.target.id==='fPurchases')readFilters('purchases')});
document.addEventListener('input',ev=>{
  const t=ev.target,id=t.id||'';let m;
  if(id==='pinInput'){t.value=t.value.replace(/\D/g,'');if(t.value.length===4)checkPin();return}
  if(U&&(m=id.match(/^u_(.+)$/))&&m[1]!=='editor'){const k=m[1].replace(/^([rl])_/,'$1_');U[k]=t.value;if(k==='company_id'||k==='amount')updateUseBal();return}
  if(B&&(m=id.match(/^b_(company_id|purchase_date|doc_no|amount|note)$/))){B[m[1]]=t.value;return}
});
document.addEventListener('change',ev=>{
  const t=ev.target,id=t.id||'';let m;
  if(U&&(m=id.match(/^u_([rl])_(sph|cyl|ax)$/))){const v=m[2]==='ax'?normAx(t.value):normPower(t.value);t.value=v;U[m[1]+'_'+m[2]]=v}
  if(id==='b_company_id'&&B){B.company_id=t.value;render()}
  if(id==='b_file'&&t.files[0])readImage(t.files[0],d=>{B.attachment=d;B.att_changed=true;render()});
  if(id==='r_year'){REPORT.year=+t.value;REPORT.data=null;render();}
  if(id==='r_company'){REPORT.company=t.value;render()}
});
function route(){const h=location.hash.slice(1);view=TABS.some(t=>t[0]===h)?h:'overview';if(view==='usages')LS.usages.loaded=false;if(view==='purchases')LS.purchases.loaded=false;render();window.scrollTo(0,0)}
window.addEventListener('hashchange',()=>{if(PIN)route()});
$('#lockBtn').onclick=()=>{PIN='';savePin('');U=null;B=null;showPin('')};

/* ---------- รหัสเข้าโปรแกรม ---------- */
function showPin(msg){
  $('#top').hidden=true;
  $('#main').innerHTML=`<form id="pinForm" class="panel pin" novalidate><h1>Social Eyewear</h1><p class="dim" style="margin:0">ใส่รหัส 4 หลักเพื่อเข้าระบบคูปองเลนส์</p><input id="pinInput" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" aria-label="รหัส 4 หลัก"><div class="error" id="pinErr" role="alert">${esc(msg||'')}</div><button class="btn primary">เข้าใช้งาน</button><a class="back" href="index.html">‹ กลับโปรแกรมหลัก</a></form>`;
  $('#pinInput').focus();
}
let pinBusy=false;
async function checkPin(){
  const i=$('#pinInput'),e=$('#pinErr');if(pinBusy||!i||!i.value)return;pinBusy=true;e.textContent='กำลังตรวจรหัส';
  try{await rpc('app_login',{p_pin:i.value});PIN=i.value;savePin(PIN);pinBusy=false;start();return}
  catch(x){i.value='';i.focus();e.textContent=x.code==='bad_pin'?'รหัสไม่ถูกต้อง':errText(x)}
  pinBusy=false;
}
async function start(){
  $('#main').innerHTML='<div class="empty">กำลังโหลด</div>';
  try{await loadOverview()}
  catch(e){if(guard(e))return;$('#top').hidden=false;$('#main').innerHTML=`<div class="panel"><div class="error">${esc(errText(e))}</div><div class="tools"><button type="button" class="btn" onclick="location.reload()">ลองอีกครั้ง</button><a class="btn" href="index.html">กลับโปรแกรมหลัก</a></div></div>`;return}
  route();
}
PIN=readPin();
if(PIN)start();else showPin('');
</script>
