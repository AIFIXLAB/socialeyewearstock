'use strict';
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const stamp=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}`};
const CFG=window.SE_CONFIG||{},PIN_KEY='social-eyewear-pin';let PIN='';
function readPin(){try{return sessionStorage.getItem(PIN_KEY)||''}catch(_){return ''}}
function savePin(v){try{v?sessionStorage.setItem(PIN_KEY,v):sessionStorage.removeItem(PIN_KEY)}catch(_){}}
async function rpc(fn,args){
  let res;try{res=await fetch(CFG.supabaseUrl.replace(/\/$/,'')+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:CFG.supabaseAnonKey,'Content-Type':'application/json'},body:JSON.stringify(args)})}
  catch(e){throw Object.assign(new Error('เชื่อมต่อไม่ได้ ตรวจอินเทอร์เน็ต'),{code:'net'})}
  if(res.status===404)throw Object.assign(new Error('missing'),{code:'missing'});
  if(!res.ok)throw new Error('เซิร์ฟเวอร์ตอบกลับผิดพลาด ('+res.status+')');
  const j=await res.json();if(!j.ok)throw Object.assign(new Error(j.message||j.error),{code:j.error});return j;
}
function download(name,data,type){const u=URL.createObjectURL(data instanceof Blob?data:new Blob([data],{type}));const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),3000)}

/* ---------- ดึงข้อมูลทั้งหมด (อ่านอย่างเดียว) ---------- */
async function collect(log){
  const out={format:'social-eyewear-full-backup',version:1,exported_at:new Date().toISOString(),source:CFG.supabaseUrl,modules:{}};
  log('ข้อมูลขาย สินค้า คอนแทคเลนส์ รายรับ-รายจ่าย ปฏิทิน');
  const rows=[];for(let from=0;;from+=1000){const j=await rpc('app_list',{p_pin:PIN,p_from:from,p_limit:1000});rows.push(...j.rows);if(j.rows.length<1000)break}
  out.modules.app_docs=rows;
  log('ใบเบิก / ใบรับเงิน');
  try{const j=await rpc('rb_export',{p_pin:PIN});out.modules.reimbursement={settings:j.settings,documents:j.documents,logs:j.logs}}
  catch(e){if(e.code!=='missing')throw e;out.modules.reimbursement=null}
  log('คูปองเลนส์');
  try{const j=await rpc('vc_export',{p_pin:PIN});out.modules.voucher={companies:j.companies,purchases:j.purchases,usages:j.usages,refunds:j.refunds,logs:j.logs}}
  catch(e){if(e.code!=='missing')throw e;out.modules.voucher=null}
  return out;
}
function counts(b){
  const a=b.modules.app_docs||[],n=c=>a.filter(r=>r.col===c).length,rb=b.modules.reimbursement,vc=b.modules.voucher;
  return [['สินค้า (รวมคอนแทคเลนส์)',n('products')],['รายการขาย',n('sales')],['รายรับ-รายจ่าย',n('ledger')],['ปฏิทิน',n('events')],
    ['ใบเบิก / ใบรับเงิน',rb?rb.documents.length:'ยังไม่ได้ติดตั้ง'],['ประวัติแก้ไขใบเบิก',rb?rb.logs.length:'–'],
    ['บริษัทเลนส์',vc?vc.companies.length:'ยังไม่ได้ติดตั้ง'],['ซื้อคูปอง',vc?vc.purchases.length:'–'],['ตัดคูปอง',vc?vc.usages.length:'–'],['คืนยอดคูปอง',vc?vc.refunds.length:'–']];
}

/* ---------- ตาราง Excel อ่านง่าย ---------- */
function sheets(b){
  const a=b.modules.app_docs||[],d=c=>a.filter(r=>r.col===c).map(r=>({id:r.id,...r.data}));
  const S={};
  S['สินค้า']=d('products').filter(p=>p.kind!=='contact').map(p=>({ประเภท:p.kind==='lens'?'เลนส์':'กรอบ',ยี่ห้อ:p.brand,รุ่น:p.model,Coating:p.coating||'',Index:p.index||'',สี:p.color||'',ทุน:p.cost,ขาย:p.price}));
  S['คอนแทคเลนส์']=d('products').filter(p=>p.kind==='contact').map(p=>({ยี่ห้อ:p.brand,รุ่น:p.model,ชนิด:p.type||'',ค่าสายตา:p.power,ทุน:p.cost,ขาย:p.price,รับเข้ารวม:(p.stockIn||[]).reduce((s,x)=>s+(+x.qty||0),0),เตือนเมื่อเหลือ:p.minStock??1}));
  S['การขาย']=d('sales').sort((x,y)=>(x.date||'').localeCompare(y.date||'')).map(s=>({วันที่:s.date,ใบเสร็จ:s.receipt,ลูกค้า:s.customer||'',เบอร์โทร:s.phone||'',พนักงาน:s.seller||'',
    กรอบ:s.frame?[s.frame.brand,s.frame.model,s.frame.color].filter(Boolean).join(' '):'',ทุนกรอบ:s.frame?.cost??'',ขายกรอบ:s.frame?.price??'',
    เลนส์:s.lens?[s.lens.brand,s.lens.model,s.lens.coating,s.lens.index].filter(Boolean).join(' '):'',ทุนเลนส์:s.lens?.cost??'',ขายเลนส์:s.lens?.price??'',
    คอนแทคเลนส์:(s.contact||[]).map(r=>`${r.brand} ${r.model} ${r.power} x${r.qty}`).join(' / '),
    คอนแทคสั่งพิเศษ:(s.special||[]).map(r=>`${r.eye} ${r.brand} ${r.model} SPH${r.sph} CYL${r.cyl||''} AX${r.axis||''} ADD${r.add||''} x${r.qty}`).join(' / '),
    ค่าอุปกรณ์:s.accessory||0,ค่าแรง:s.labor||0,ส่วนลด:s.discount||0,ค่ารูดบัตร:s.other||0,หมายเหตุ:s.note||''}));
  S['รายรับรายจ่าย']=d('ledger').map(e=>({วันที่:e.date,ประเภท:e.type==='income'?'รายรับ':'รายจ่าย',หมวด:e.category,รายละเอียด:e.title||'',จำนวนเงิน:e.amount}));
  S['ปฏิทิน']=d('events').map(e=>({วันที่:e.date,เวลา:e.time||'',ประเภท:e.kind||'',หัวข้อ:e.title,หมายเหตุ:e.note||''}));
  const rb=b.modules.reimbursement;
  if(rb)S['ใบเบิก']=rb.documents.map(x=>{const c=x.customer||{},p=x.prescription||{};return {เลขที่:x.doc_no,เล่มที่:x.book_no||'',วันที่:x.doc_date,สถานะ:x.status,ประเภท:x.claim_type==='frame_lens'?'กรอบพร้อมเลนส์':'เลนส์อย่างเดียว',
    ลูกค้า:c.party_type==='company'?c.company_name:[c.title,c.first_name,c.last_name].filter(Boolean).join(' '),ที่อยู่:c.address||'',โทร:c.phone||'',เลขผู้เสียภาษี:c.tax_id||'',
    รายการ:(x.items||[]).map(i=>[i.kind==='frame'?'กรอบ':'เลนส์',i.brand,i.model,i.lens_index,i.coating,i.amount].filter(Boolean).join(' ')).join(' / '),
    ส่วนลด:x.discount,ยอดสุทธิ:x.total,R:[p.r_sph,p.r_cyl,p.r_axis,p.r_add].filter(Boolean).join(' '),L:[p.l_sph,p.l_cyl,p.l_axis,p.l_add].filter(Boolean).join(' '),PD:p.pd_total||[p.r_pd,p.l_pd].filter(Boolean).join('/'),ผู้บันทึก:x.created_by||''}});
  const vc=b.modules.voucher;
  if(vc){const cn=id=>(vc.companies.find(c=>c.id===id)||{}).name||'';
    S['คูปอง_ซื้อ']=vc.purchases.map(x=>({วันที่:x.purchase_date,บริษัท:cn(x.company_id),เลขที่เอกสาร:x.doc_no||'',จำนวนเงิน:x.amount,หมายเหตุ:x.note||'',สถานะ:x.status,เหตุผลยกเลิก:x.cancel_reason||''}));
    S['คูปอง_ตัด']=vc.usages.map(x=>({วันที่:x.use_date,บริษัท:cn(x.company_id),เลขบิล:x.bill_no||'',OD:[x.r_sph,x.r_cyl,x.r_ax].filter(Boolean).join(' '),OS:[x.l_sph,x.l_cyl,x.l_ax].filter(Boolean).join(' '),ชนิด:x.lens_type||'',Index:x.lens_index||'',รุ่น:x.lens_model||'',คู่:x.pairs,มูลค่า:x.amount,หมายเหตุ:x.note||'',สถานะ:x.status}));
    S['คูปอง_คืนยอด']=vc.refunds.map(x=>({วันที่:x.refund_date,จำนวนเงิน:x.amount,เหตุผล:x.reason,รายการตัด:x.usage_id}));}
  return S;
}

/* ---------- สร้าง SQL กู้ข้อมูลเข้าฐานใหม่ ---------- */
function restoreSql(b){
  const tag='$SE'+Math.random().toString(36).slice(2,8)+'$';
  const J=v=>tag+JSON.stringify(v??[])+tag+'::jsonb';
  const L=['-- กู้ข้อมูล Social Eyewear จากไฟล์สำรอง '+b.exported_at,'-- ต้องรัน schema.sql, 02_reimbursement.sql, 03_voucher.sql ในฐานข้อมูลใหม่ก่อน แล้วค่อยรันไฟล์นี้ รันซ้ำได้ ไม่สร้างข้อมูลซ้ำ','begin;'];
  const a=(b.modules.app_docs||[]).map(r=>({col:r.col,id:r.id,data:r.data}));
  L.push(`insert into public.app_docs (col, id, data) select x.col, x.id, x.data from jsonb_to_recordset(${J(a)}) as x(col text, id text, data jsonb) on conflict (col, id) do nothing;`);
  const rb=b.modules.reimbursement;
  if(rb){
    if(rb.settings)L.push(`insert into public.document_settings (id, shop, numbering, counters) select 1, x.shop, x.numbering, x.counters from jsonb_to_record(${tag+JSON.stringify(rb.settings)+tag}::jsonb) as x(shop jsonb, numbering jsonb, counters jsonb) on conflict (id) do update set shop = excluded.shop, numbering = excluded.numbering, counters = excluded.counters;`);
    L.push(`insert into public.reimbursement_documents select * from jsonb_populate_recordset(null::public.reimbursement_documents, ${J(rb.documents.map(d=>{const x={...d};delete x.customer;delete x.items;delete x.prescription;return x}))}) on conflict do nothing;`);
    L.push(`insert into public.reimbursement_customers select * from jsonb_populate_recordset(null::public.reimbursement_customers, ${J(rb.documents.filter(d=>d.customer).map(d=>({...d.customer,document_id:d.id})))}) on conflict do nothing;`);
    L.push(`insert into public.reimbursement_items (document_id, kind, sort, brand, model, color, product_code, lens_index, coating, lens_type, amount) select x.document_id, x.kind, x.sort, x.brand, x.model, x.color, x.product_code, x.lens_index, x.coating, x.lens_type, x.amount from jsonb_populate_recordset(null::public.reimbursement_items, ${J(rb.documents.flatMap(d=>(d.items||[]).map((it,i)=>({...it,document_id:d.id,sort:i+1}))))}) x where not exists (select 1 from public.reimbursement_items i where i.document_id = x.document_id);`);
    L.push(`insert into public.reimbursement_prescriptions select * from jsonb_populate_recordset(null::public.reimbursement_prescriptions, ${J(rb.documents.filter(d=>d.prescription).map(d=>({...d.prescription,document_id:d.id})))}) on conflict do nothing;`);
    L.push(`insert into public.document_revision_logs (document_id, revision, action, editor, changes, snapshot, created_at) select x.document_id, x.revision, x.action, x.editor, x.changes, x.snapshot, x.created_at from jsonb_populate_recordset(null::public.document_revision_logs, ${J(rb.logs)}) x where not exists (select 1 from public.document_revision_logs l where l.document_id = x.document_id and l.revision = x.revision and l.action = x.action);`);
  }
  const vc=b.modules.voucher;
  if(vc){
    const ids=vc.companies.map(c=>"'"+String(c.id).replace(/'/g,'')+"'").join(',')||"'00000000-0000-0000-0000-000000000000'";
    L.push(`delete from public.voucher_companies c where c.id not in (${ids}) and not exists (select 1 from public.voucher_purchases p where p.company_id = c.id) and not exists (select 1 from public.voucher_usages u where u.company_id = c.id);`);
    L.push(`insert into public.voucher_companies select * from jsonb_populate_recordset(null::public.voucher_companies, ${J(vc.companies)}) on conflict do nothing;`);
    L.push(`insert into public.voucher_purchases select * from jsonb_populate_recordset(null::public.voucher_purchases, ${J(vc.purchases)}) on conflict do nothing;`);
    L.push(`insert into public.voucher_usages select * from jsonb_populate_recordset(null::public.voucher_usages, ${J(vc.usages)}) on conflict do nothing;`);
    L.push(`insert into public.voucher_refunds select * from jsonb_populate_recordset(null::public.voucher_refunds, ${J(vc.refunds)}) on conflict do nothing;`);
    L.push(`insert into public.voucher_logs (entity, entity_id, action, editor, before, after, note, created_at) select x.entity, x.entity_id, x.action, x.editor, x.before, x.after, x.note, x.created_at from jsonb_populate_recordset(null::public.voucher_logs, ${J(vc.logs)}) x where not exists (select 1 from public.voucher_logs l where l.entity_id = x.entity_id and l.action = x.action and l.created_at = x.created_at);`);
  }
  L.push('commit;','');
  return L.join('\n\n');
}

/* ---------- ซิปฉุกเฉิน (เขียนซิปเอง ไม่ต้องพึ่งไลบรารี) ---------- */
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(u){let c=0xFFFFFFFF;for(let i=0;i<u.length;i++)c=CRC[(c^u[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0}
function makeZip(files){
  const enc=new TextEncoder(),parts=[],cd=[];let off=0;const d=new Date();
  const dt=((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate(),tm=(d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1);
  for(const f of files){
    const name=enc.encode(f.path),data=typeof f.data==='string'?enc.encode(f.data):new Uint8Array(f.data),crc=crc32(data);
    const h=new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(8,0,true);h.setUint16(10,tm,true);h.setUint16(12,dt,true);
    h.setUint32(14,crc,true);h.setUint32(18,data.length,true);h.setUint32(22,data.length,true);h.setUint16(26,name.length,true);h.setUint16(28,0,true);
    parts.push(new Uint8Array(h.buffer),name,data);
    const c=new DataView(new ArrayBuffer(46));
    c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(10,0,true);c.setUint16(12,tm,true);c.setUint16(14,dt,true);
    c.setUint32(16,crc,true);c.setUint32(20,data.length,true);c.setUint32(24,data.length,true);c.setUint16(28,name.length,true);c.setUint32(42,off,true);
    cd.push(new Uint8Array(c.buffer),name);off+=30+name.length+data.length;
  }
  const cdSize=cd.reduce((a,x)=>a+x.length,0),e=new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cdSize,true);e.setUint32(16,off,true);
  return new Blob([...parts,...cd,new Uint8Array(e.buffer)],{type:'application/zip'});
}
function toCsv(rows){
  if(!rows.length)return '\ufeffไม่มีรายการ\r\n';
  const keys=[...new Set(rows.flatMap(r=>Object.keys(r)))];
  const cell=v=>{if(v==null)return '';let t=typeof v==='object'?JSON.stringify(v):String(v);if(/^[=+\-@]/.test(t)&&!/^[+-]?\d/.test(t))t="'"+t;return '"'+t.replace(/"/g,'""')+'"'};
  return '\ufeff'+[keys.map(cell).join(',')].concat(rows.map(r=>keys.map(k=>cell(r[k])).join(','))).join('\r\n');
}

  ['03_docs/original_requirements/01_ความต้องการเริ่มต้น_บัญชีร้าน.txt','setup/docs/original_requirements/01_initial.txt'],['03_docs/original_requirements/02_สเปก_ใบเบิกใบรับเงิน.txt','setup/docs/original_requirements/02_receipt_spec.txt'],['03_docs/original_requirements/03_สเปก_คูปองเลนส์.txt','setup/docs/original_requirements/03_voucher_spec.txt'],

async function grab(url){try{const r=await fetch(url,{cache:'no-store'});if(!r.ok)return null;return new Uint8Array(await r.arrayBuffer())}catch(_){return null}}
async function buildZip(b,log){
  const day=stamp().slice(0,10),root=`SocialEyewear_Stock_Backup_${day}/`,files=[],missing=[];
  log('ไฟล์เว็บ');
  for(const f of SITE_FILES){const d=await grab(f);if(d)files.push({path:root+'01_website/'+f,data:d});else missing.push('01_website/'+f)}
  log('SQL และคู่มือ');
  for(const[to,from]of SETUP_FILES){const d=await grab(from);if(d)files.push({path:root+to,data:d});else missing.push(to)}
  log('ข้อมูลร้าน');
  const D=root+'04_data_backup/',T=D+'แยกตามตาราง/',s=stamp();
  files.push({path:D+`social-eyewear-data_${s}.json`,data:JSON.stringify(b)});
  files.push({path:D+`social-eyewear-restore_${s}.sql`,data:restoreSql(b)});
  if(window.XLSX){const wb=XLSX.utils.book_new();Object.entries(sheets(b)).forEach(([n,rows])=>XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows.length?rows:[{ข้อมูล:'ไม่มีรายการ'}]),n.slice(0,31)));files.push({path:D+`social-eyewear-tables_${s}.xlsx`,data:XLSX.write(wb,{bookType:'xlsx',type:'array'})})}
  else missing.push('04_data_backup/ไฟล์ Excel (ใช้ไฟล์ csv ในโฟลเดอร์แยกตามตารางแทนได้)');
  const tables={},a=b.modules.app_docs||[];
  ['products','sales','ledger','events'].forEach(c=>tables['app_docs_'+c]=a.filter(r=>r.col===c).map(r=>({id:r.id,...r.data})));
  const rb=b.modules.reimbursement;if(rb){tables.reimbursement_documents=rb.documents.map(d=>{const x={...d};delete x.customer;delete x.items;delete x.prescription;return x});
    tables.reimbursement_customers=rb.documents.filter(d=>d.customer).map(d=>({document_id:d.id,...d.customer}));tables.reimbursement_items=rb.documents.flatMap(d=>(d.items||[]).map(i=>({document_id:d.id,...i})));
    tables.reimbursement_prescriptions=rb.documents.filter(d=>d.prescription).map(d=>({document_id:d.id,...d.prescription}));tables.document_revision_logs=rb.logs.map(l=>{const x={...l};delete x.snapshot;return x});tables.document_settings=rb.settings?[rb.settings]:[]}
  const vc=b.modules.voucher;if(vc){tables.voucher_companies=vc.companies;tables.voucher_purchases=vc.purchases.map(p=>{const x={...p};x.attachment=x.attachment?'(มีรูป ดูในไฟล์ .json)':'';return x});tables.voucher_usages=vc.usages;tables.voucher_refunds=vc.refunds;tables.voucher_logs=vc.logs}
  Object.entries(tables).forEach(([n,rows])=>{files.push({path:T+n+'.csv',data:toCsv(rows)});files.push({path:T+n+'.json',data:JSON.stringify(rows,null,1)})});
  const sum=['สรุปชุดสำรอง Social Eyewear Stock','สร้างเมื่อ: '+new Date().toLocaleString('th-TH'),'ฐานข้อมูล: '+(b.source||''),'',...counts(b).map(([k,v])=>`${k}: ${typeof v==='number'?v.toLocaleString()+' รายการ':v}`),'','ไฟล์ในโฟลเดอร์แยกตามตาราง:',...Object.entries(tables).map(([n,r])=>`  ${n}: ${r.length} แถว`),'',missing.length?'ไฟล์ที่ดึงไม่ได้ (ใช้จากชุดสำรองฉบับก่อนแทน):\n'+missing.map(m=>'  - '+m).join('\n'):'ไฟล์ครบทุกไฟล์'];
  files.push({path:D+'สรุป.txt',data:sum.join('\r\n')});
  return {blob:makeZip(files),name:`SocialEyewear_Stock_Backup_${s}.zip`,count:files.length,missing};
}
async function runZip(){
  const btn=$('#goZip'),st=$('#status');btn.disabled=true;
  try{const b=await collect(t=>st.innerHTML=`<div class="notice">กำลังดึง: ${esc(t)}</div>`);
    const z=await buildZip(b,t=>st.innerHTML=`<div class="notice">กำลังรวมไฟล์: ${esc(t)}</div>`);download(z.name,z.blob);
    st.innerHTML=`<div class="notice ok">ดาวน์โหลด <b>${esc(z.name)}</b> แล้ว (${z.count} ไฟล์)${z.missing.length?`<br>ดึงไม่ได้ ${z.missing.length} ไฟล์: ${z.missing.map(esc).join(', ')}`:''}</div>${summary(b)}`}
  catch(e){if(e.code==='bad_pin'){savePin('');return showPin('กรุณาใส่รหัสอีกครั้ง')}st.innerHTML=`<div class="notice err">${esc(e.message)}</div>`}
  btn.disabled=false;
}

   <p class="dim" style="margin:0">ดึงข้อมูลทุกระบบในร้านออกมาเก็บไว้ในคอมหรือแฟลชไดรฟ์ ได้แก่ การขาย สินค้า คอนแทคเลนส์ รายรับ-รายจ่าย ปฏิทิน ใบเบิก และคูปองเลนส์ การดึงข้อมูลนี้อ่านอย่างเดียว ไม่แก้หรือลบข้อมูลในระบบ</p>
   <div class="tools"><button class="btn primary" id="goZip">ดาวน์โหลดชุดสำรองฉุกเฉิน (ซิปเดียว)</button><button class="btn" id="go">ดาวน์โหลดเฉพาะข้อมูล (3 ไฟล์)</button></div>
   <p class="dim" style="margin:0">ชุดสำรองฉุกเฉินรวมทุกอย่างในซิปเดียว: ไฟล์เว็บที่ใช้งานจริง SQL สร้างฐานข้อมูล คู่มือ ข้อความสั่ง AI และข้อมูลร้านล่าสุดแยกตามตาราง เก็บซิปนี้ไว้ในคอมและแฟลชไดรฟ์ได้เลย</p>
   <div id="status"></div></section>
  <section class="panel"><h2>ได้ไฟล์อะไรบ้าง</h2><ol>
   <li><b>social-eyewear-data_วันที่.json</b> ข้อมูลครบทุกระบบ ใช้กู้ระบบคืน (เปิดอ่านด้วยตาไม่สะดวก)</li>
   <li><b>social-eyewear-tables_วันที่.xlsx</b> ตาราง Excel อ่านง่าย แยกแผ่นตามระบบ ใช้ดูข้อมูลได้แม้ระบบล่ม</li>
   <li><b>social-eyewear-restore_วันที่.sql</b> คำสั่งกู้ข้อมูลเข้าฐานข้อมูลใหม่ (ใช้ตอนย้ายไปผู้ให้บริการใหม่)</li></ol>
   <p class="dim" style="margin:0">นำทั้ง 3 ไฟล์ไปเก็บในโฟลเดอร์ <b>04_data_backup</b> ของชุดสำรอง แนะนำให้ทำอย่างน้อยเดือนละครั้ง และทุกครั้งก่อนแก้ระบบ</p></section>
  <section class="panel"><h2>สร้างไฟล์กู้ข้อมูลจากไฟล์สำรองเก่า</h2><p class="dim" style="margin:0">ถ้ามีไฟล์ .json อยู่แล้ว เลือกไฟล์ด้านล่างเพื่อสร้างไฟล์ .sql และ Excel ใหม่ได้ ไม่ต้องเชื่อมต่อระบบ</p><input type="file" id="file" accept=".json,application/json"><div id="fstatus"></div></section>`;
  $('#go').onclick=run;$('#goZip').onclick=runZip;$('#file').onchange=fromFile;
}
function summary(b){return `<table>${counts(b).map(([k,v])=>`<tr><td>${k}</td><td>${typeof v==='number'?v.toLocaleString()+' รายการ':v}</td></tr>`).join('')}</table>`}
async function makeFiles(b){
  const s=stamp();
  download(`social-eyewear-data_${s}.json`,JSON.stringify(b),'application/json');
  await new Promise(r=>setTimeout(r,400));
  download(`social-eyewear-restore_${s}.sql`,restoreSql(b),'application/sql');
  await new Promise(r=>setTimeout(r,400));
  if(window.XLSX){const wb=XLSX.utils.book_new();Object.entries(sheets(b)).forEach(([n,rows])=>XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows.length?rows:[{ข้อมูล:'ไม่มีรายการ'}]),n.slice(0,31)));
    download(`social-eyewear-tables_${s}.xlsx`,new Blob([XLSX.write(wb,{bookType:'xlsx',type:'array'})],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));return true}
  return false;
}
async function run(){
  const btn=$('#go'),st=$('#status');btn.disabled=true;
  try{const b=await collect(t=>st.innerHTML=`<div class="notice">กำลังดึง: ${esc(t)}</div>`);LAST=b;const x=await makeFiles(b);
    st.innerHTML=`<div class="notice ok">ดาวน์โหลดแล้ว ${x?'3':'2'} ไฟล์ ${x?'':'(ไฟล์ Excel สร้างไม่ได้ เพราะโหลดตัวช่วยไม่สำเร็จ ไฟล์ .json ยังครบ)'}</div>${summary(b)}`}
  catch(e){if(e.code==='bad_pin'){savePin('');return showPin('กรุณาใส่รหัสอีกครั้ง')}st.innerHTML=`<div class="notice err">${esc(e.message)}</div>`}
  btn.disabled=false;
}
async function fromFile(ev){
  const f=ev.target.files[0],st=$('#fstatus');if(!f)return;
  try{const b=JSON.parse(await f.text());if(b.format!=='social-eyewear-full-backup')throw new Error('ไฟล์นี้ไม่ใช่ไฟล์สำรองทั้งหมดของ Social Eyewear');const x=await makeFiles(b);st.innerHTML=`<div class="notice ok">สร้างไฟล์แล้ว ${x?'(.json .sql .xlsx)':'(.json .sql)'}</div>${summary(b)}`}
  catch(e){st.innerHTML=`<div class="notice err">${esc(e.message||'อ่านไฟล์ไม่ได้')}</div>`}
}
function showPin(msg){
  $('#main').innerHTML=`<form id="pinForm" class="panel pin" novalidate><h1>Social Eyewear</h1><p class="dim" style="margin:0">ใส่รหัส 4 หลักเพื่อสำรองข้อมูล</p><input id="pinInput" type="password" inputmode="numeric" maxlength="4" autocomplete="off" aria-label="รหัส 4 หลัก"><div id="pinErr" style="color:var(--loss)">${esc(msg||'')}</div><button class="btn primary">เข้าใช้งาน</button><a class="back" href="index.html">‹ กลับโปรแกรมหลัก</a></form>`;
  const i=$('#pinInput');i.focus();
  const go=async()=>{if(!i.value)return;try{await rpc('app_login',{p_pin:i.value});PIN=i.value;savePin(PIN);view()}catch(e){i.value='';$('#pinErr').textContent=e.code==='bad_pin'?'รหัสไม่ถูกต้อง':e.message}};
  $('#pinForm').onsubmit=e=>{e.preventDefault();go()};i.oninput=()=>{i.value=i.value.replace(/\D/g,'');if(i.value.length===4)go()};
}
PIN=readPin();if(PIN)view();else showPin('');
